<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Conviction Engine v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: status strip; 11 identical play cards (NVDA, TSLA first and verified); paper log; rules + backtest at the bottom. Dark single-theme terminal. */
:root{
  --bg:#0a0e13; --panel:#11171f; --panel-2:#161e28; --line:#223040; --line-2:#2c3b4d;
  --fg:#d9e2ec; --muted:#8193a6; --dim:#5a6a7e;
  --accent:#5fb4ff;
  --go:#2bea7c; --go-ink:#03140a; --go-soft:rgba(43,234,124,.13);
  --warn:#ff5a5f; --warn-soft:rgba(255,90,95,.13);
  --amber:#ffc24b; --amber-soft:rgba(255,194,75,.12);
  --pink:#ff6fb5; --yellow:#ffe14d;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:grid;gap:16px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;line-height:1;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.05em;margin:0;text-transform:uppercase}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;padding:3px 9px;border:1px solid var(--line-2);border-radius:4px;color:var(--muted);white-space:nowrap}
.chip.live{color:var(--go);border-color:rgba(43,234,124,.5)}
.chip.sim{color:var(--amber);border-color:rgba(255,194,75,.5)}
.chip.win{color:var(--accent);border-color:rgba(95,180,255,.5)}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:6px 10px}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
.bar-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.bar-controls .sep{width:1px;align-self:stretch;background:var(--line)}
.bar-controls label{color:var(--muted);font-size:12px;font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.note{color:var(--muted);font-size:12px}
.err{color:var(--warn);font-size:12px}

.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.rules{grid-template-columns:minmax(0,1fr)}}
.rule{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.rule .k{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.rule .k b{color:var(--accent);font-weight:700}
.rule .v{font-size:13px;margin-top:2px}
.base{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.stat .k{font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:18px;font-weight:600;margin-top:2px}
.stat .v.small{font-size:14px}
.pnl-t th,.pnl-t td{text-align:left;vertical-align:top}
.pnl-h{font-family:var(--f-display);font-size:13px;white-space:normal;min-width:120px}
.pnl-v{font-family:var(--f-mono);font-size:18px;font-weight:600}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;min-width:0}
.card.go{border-color:var(--go);box-shadow:0 0 0 1px var(--go) inset}
.card.stopped{border-color:rgba(255,90,95,.6)}
.card.flash{animation:flash .5s ease-in-out 5}
@keyframes flash{0%,100%{box-shadow:0 0 0 1px var(--go) inset}50%{box-shadow:0 0 0 1px var(--go) inset,0 0 0 9px rgba(43,234,124,.35)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sym{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.03em;line-height:1}
.side{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;margin-left:8px;color:var(--muted)}
.side.calls{color:var(--go)} .side.puts{color:var(--warn)}
.pill{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;font-size:15px;padding:5px 12px;border-radius:5px;border:1px solid var(--line-2);color:var(--muted);background:var(--panel-2);white-space:nowrap}
.pill.SCAN{color:var(--accent);border-color:rgba(95,180,255,.55)}
.pill.GO{color:var(--go-ink);background:var(--go);border-color:var(--go)}
.pill.STOP{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.pill.FLAT{color:var(--amber);border-color:rgba(255,194,75,.6);background:var(--amber-soft)}
.price{font-size:26px;font-weight:600}
.up{color:var(--go)} .dn{color:var(--warn)}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv > div{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-width:0}
.kv .k{font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kv .v{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scorehead{display:flex;justify-content:space-between;align-items:baseline}
.scorehead .big{font-family:var(--f-mono);font-size:28px;font-weight:600;line-height:1}
.lbl{font-family:var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-size:12px}
.meter{position:relative;height:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;transition:width .25s ease}
.meter .tick{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--go)}
.layers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:560px){.layers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.layer{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel-2);min-width:0}
.layer.on{border-color:rgba(43,234,124,.55);background:var(--go-soft)}
.layer.req{border-style:dashed}
.layer.req.on{border-style:solid}
.layer .lt{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.layer .lt b{color:var(--dim)} .layer.on .lt b{color:var(--go)}
.layer .lv{font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
@media (max-width:480px){.trade{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trade .k{font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.trade .v{font-family:var(--f-mono);font-size:14px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:11px}
td:first-child,th:first-child{text-align:left}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.routes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:900px){.routes{grid-template-columns:minmax(0,1fr)}}
.route{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;min-width:0}
.route.live{border-color:var(--go);box-shadow:0 0 0 1px var(--go) inset}
.route .rs{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.03em}
.occ{display:grid;gap:4px}
.size{display:grid;gap:2px;background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px}
.size .big{font-size:20px;font-weight:600;color:var(--accent)}
.size.warn{color:var(--amber);border-color:rgba(255,194,75,.5);font-size:13px}
.riskin{display:flex;gap:8px;align-items:center}
.riskin input{width:110px}
.occ code{font-family:var(--f-mono);font-size:18px;font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--line-2);border-radius:5px;padding:4px 8px;overflow-wrap:anywhere;user-select:all}
.legend{display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:2px;margin-right:5px;vertical-align:middle}
.refgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:900px){.refgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.refgrid{grid-template-columns:minmax(0,1fr)}}
.ref{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:7px;min-width:0}
.ref.go{border-color:var(--go);box-shadow:0 0 0 1px var(--go) inset}
.ref.flash{animation:flash .5s ease-in-out 5}
.ref .rs{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.03em}
.ref .pill{font-size:12px;padding:3px 8px}
.ref .meter{height:8px}
.flags{display:flex;gap:5px;flex-wrap:wrap}
.flag{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--line-2);border-radius:3px;color:var(--dim)}
.flag.on{color:var(--go);border-color:rgba(43,234,124,.5);background:var(--go-soft)}
.toast.ref{background:var(--panel-2);color:var(--go);border:1px solid var(--go);box-shadow:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
.ctx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.ctx{grid-template-columns:minmax(0,1fr)}}
.ctxrow{display:grid;grid-template-columns:64px repeat(4,minmax(0,1fr));gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.ctxrow .s{font-family:var(--f-display);font-weight:700;font-size:20px}
.ctxrow .k{font-family:var(--f-display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ctxrow .v{font-family:var(--f-mono);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.prog{height:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.prog > div{height:100%;background:var(--accent)}
.curve{width:100%;height:90px;display:block}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end}
@media (max-width:760px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}}
.form label{display:grid;gap:3px;font-size:11px;color:var(--muted);font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.form input,.form select{width:100%;min-width:0}
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:grid;gap:8px;z-index:20;pointer-events:none}
.toast{background:var(--go);color:var(--go-ink);font-family:var(--f-display);font-weight:700;letter-spacing:.06em;font-size:18px;padding:10px 16px;border-radius:6px;box-shadow:0 8px 30px rgba(43,234,124,.35)}
.toast.stop{background:var(--warn);color:#1a0405}
.toast.flat{background:var(--amber);color:#1a1203}
footer{color:var(--dim);font-size:12px;line-height:1.6}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none}.meter .fill{transition:none}}
.monline{font-size:12px;line-height:1.5;color:var(--fg);border:1px dashed var(--line-2);border-radius:8px;padding:6px 8px}
.monline .dim{color:var(--muted)}
.layers.mini{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.layers.mini .layer{padding:6px 8px}
.layers.mini .lv{font-size:11px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.ahpx{display:inline-block;margin-left:10px;font-size:13px;color:#c9a7ff;border:1px solid rgba(201,167,255,.45);border-radius:4px;padding:1px 6px}
.ahpx span{opacity:.85}
.ladder{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 24px));z-index:15;background:rgba(17,23,31,.97);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden}
.ladder .lhead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;border-radius:0;background:var(--panel-2);font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:8px 12px}
.ladder .lgo{color:var(--go)}
.ladder .lbody{max-height:min(60vh,520px);overflow-y:auto;display:grid}
.lrow{display:grid;grid-template-columns:20px 72px 16px 30px 74px minmax(0,1fr);align-items:center;gap:6px;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:6px 10px;font-size:13px}
.lrow:hover{background:var(--panel-2)}
.lrow.g0{background:rgba(43,234,124,.10);box-shadow:inset 3px 0 0 var(--go)}
.lrow.g1{box-shadow:inset 3px 0 0 var(--amber)}
.lrow.g3{opacity:.7}
.lrow.flash{animation:lflash .5s ease-in-out 6}
@keyframes lflash{50%{background:rgba(43,234,124,.35)}}
.lrank{color:var(--dim);font-size:11px}
.lsym{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.03em;white-space:nowrap}
.lver{font-style:normal;color:var(--accent);font-size:11px;margin-left:3px}
.lbt{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:5px;vertical-align:2px;background:var(--dim)}
.lbt.good{background:var(--go)} .lbt.bad{background:var(--warn)}
.lside{font-family:var(--f-display);font-weight:700}
.lscore{text-align:right}
.ldots{display:flex;gap:2px}
.ldots i{font-style:normal;font-family:var(--f-mono);font-size:10px;width:16px;text-align:center;border:1px solid var(--line-2);border-radius:3px;color:var(--dim)}
.ldots i.on{color:var(--go-ink);background:var(--go);border-color:var(--go)}
.lstat{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.lstat.live{color:var(--yellow);font-weight:600}
.lfoot{padding:6px 10px 8px}
.ladder.min{width:auto}
@media (prefers-reduced-motion:reduce){.lrow.flash{animation:none}}
.wrap{padding-bottom:120px}
.mutebtn{background:transparent}
.mutebtn.on{color:var(--amber);border-color:rgba(255,194,75,.6)}
.pill.TECH{color:#1a1203;background:var(--amber);border-color:var(--amber)}
.card.tech{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.techstamp{background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber);border-radius:6px;padding:7px 10px;font-size:14px;font-weight:600}
.techstamp.done{opacity:.6;font-weight:500}
.toast.tech{background:var(--amber);color:#1a1203;box-shadow:0 8px 30px rgba(255,194,75,.35)}
.chip.techchip{color:var(--amber);border-color:rgba(255,194,75,.6)}
.lrow.g05{background:var(--amber-soft);box-shadow:inset 3px 0 0 var(--amber)}
.lstat.tech{color:var(--amber);font-weight:600}
.ladder .ltech{color:var(--amber)}
.chip.clock{color:var(--fg)}
.chip.clock.replay{color:var(--amber);border-color:rgba(255,194,75,.6)}
td.amb{color:var(--amber)}
.tracker{border:1px solid var(--line-2);border-radius:8px;padding:9px 10px;display:grid;gap:7px;background:var(--panel-2)}
.tracker.bad{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.tracker.good{border-color:var(--go);box-shadow:0 0 0 1px var(--go) inset}
.tstate{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;font-size:13px;color:var(--fg)}
.tstate.bad{color:var(--warn)} .tstate.good{color:var(--go)} .tstate.neg{color:#ff9a9e} .tstate.pos{color:#8ff0b5} .tstate.flat{color:var(--amber)}
.tbar{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,rgba(255,90,95,.35) 0%,rgba(255,90,95,.12) 25%,rgba(43,234,124,.12) 25%,rgba(43,234,124,.35) 100%);border:1px solid var(--line)}
.tbar .tfill{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.18)}
.tbar .tentry{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);transform:translateX(-1px)}
.tbar .tnow{position:absolute;top:-4px;width:14px;height:18px;border-radius:4px;background:var(--yellow);transform:translateX(-7px);box-shadow:0 0 0 2px var(--bg)}
.tlabels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px}
.tgrid .k{font-family:var(--f-display);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tgrid .v{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fadebox{background:var(--amber-soft);border:1px dashed var(--amber);color:var(--amber);border-radius:6px;padding:6px 9px;font-size:13px;font-weight:600}
.tplad{display:flex;flex-wrap:wrap;gap:6px}
.tpl{font-size:12px;border:1px solid var(--line-2);border-radius:5px;padding:2px 7px;color:var(--muted)}
.tpl b{font-weight:600} .tpl.up b{color:var(--go)} .tpl.dn b{color:var(--warn)}
.tpl.hit.up{background:var(--go-soft);border-color:var(--go);color:var(--go)} .tpl.hit.dn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.feed{display:grid;gap:3px;border-top:1px solid var(--line);padding-top:6px;font-size:12.5px}

/* ======================= Time helpers (CT) ======================= */
const ctFmt = new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short'});
function ctParts(ms){

function hms(ms){ return new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date(ms)); }
function hm(min){ if(min==null) return '–'; const h=Math.floor(min/60), m=min%60; const hh=((h+11)%12)+1; return `${hh}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`; }
function fridayNear(dateStr, days){

  const dow = d.getUTCDay(); const diff = (5-dow+7)%7; const back = diff>3 ? diff-7 : diff;
  d.setUTCDate(d.getUTCDate()+back); return d.toISOString().slice(0,10);
}
function shiftDays(dateStr, n){ const d=new Date(dateStr+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }

/* ======================= Math ======================= */
function ncdf(x){ const t=1/(1+0.2316419*Math.abs(x)); const d=0.3989423*Math.exp(-x*x/2); const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return x>0?1-p:p; }
function npdf(x){ return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI); }
function bs(S,K,T,iv,call){ const r=0.04; const s=iv*Math.sqrt(T); const d1=(Math.log(S/K)+(r+iv*iv/2)*T)/s, d2=d1-s;
  const price = call ? S*ncdf(d1)-K*Math.exp(-r*T)*ncdf(d2) : K*Math.exp(-r*T)*ncdf(-d2)-S*ncdf(-d1);
  const delta = call ? ncdf(d1) : ncdf(d1)-1; const gamma = npdf(d1)/(S*s);
  const theta = (-(S*npdf(d1)*iv)/(2*Math.sqrt(T)) - (call?1:-1)*r*K*Math.exp(-r*T)*ncdf(call?d2:-d2))/365;
  return {price,delta,gamma,theta}; }
function occ(sym, exp, side, strike){ return `O:${sym}${exp.slice(2,4)}${exp.slice(5,7)}${exp.slice(8,10)}${side>0?'C':'P'}${String(Math.round(strike*1000)).padStart(8,'0')}`; }
function dteOf(today, exp){ return Math.round((new Date(exp+'T12:00:00Z')-new Date(today+'T12:00:00Z'))/864e5); }
// Black-Scholes fallback (simulation or live chain unavailable): ATM strike, Friday nearest 30 days, IV proxied from ATR
function estContract(S, atr, side, today){
  today = today || ctParts(Date.now()).date;
  const exp = fridayNear(today, RULES.DTE), dte = dteOf(today, exp);
  const iv = Math.max(0.15, (atr/S)*Math.sqrt(252)*0.85), T = dte/365, call = side>0;
  const step = S>500?10:(S>200?5:(S>50?2.5:(S>20?1:0.5)));
  const k = Math.round(S/step)*step; const g = bs(S,k,T,iv,call);
  return {strike:k, mid:g.price, bid:null, ask:null, delta:g.delta, gamma:g.gamma, theta:g.theta, iv, spreadPct:null, expiry:exp, dte, ticker:occ('SYM',exp,side,k), est:true};
}
// Value projection at 2:40 for a favorable move m ($ of stock) using delta/gamma/theta
function project(c, m, holdFrac){ const v = c.mid + Math.abs(c.delta)*m + 0.5*c.gamma*m*m + c.theta*holdFrac; return Math.max(0.01, v); }

/* ======================= Scoring ======================= */
function analyze(bars, ref){
  // bars: [{min,o,h,l,c,v}] RTH CT minutes for today, ascending
  const rth = bars.filter(b=>b.min>=RULES.OPEN && b.min<15*60);
  if(!rth.length){
    // premarket: show the latest price and the premarket path; no range, no score yet
    const pre = bars.filter(b=>b.min<RULES.OPEN); if(!pre.length) return null; const lp = pre[pre.length-1];
    return {price:lp.c, lastMin:lp.min, premarket:true, orReady:false, orHi:NaN, orLo:NaN, cvd:0, vol:0, vwap:lp.c, flowPct:0,
            series: pre.slice(-90).map(b=>({m:b.min, c:b.c, f:0})), firstCross:()=>null, hiSince:()=>-Infinity, loSince:()=>Infinity, closeAt:()=>lp.c};
  }

  const orHi = Math.max(...orBars.map(b=>b.h)), orLo = Math.min(...orBars.map(b=>b.l));
  let cvd=0, vol=0, pv=0;
  for(const b of rth){ const rng=b.h-b.l; cvd += rng>0 ? b.v*((b.c-b.l)-(b.h-b.c))/rng : 0; vol+=b.v; pv += b.v*(b.h+b.l+b.c)/3; }

  return {price:last.c, lastMin:last.min, ah, closed: last.min>=15*60-1, orHi, orLo, orReady, cvd, vol, vwap: vol>0?pv/vol:last.c, flowPct: vol>0?cvd/vol:0, series,

function score(a, atr, side, pUp, spreadOk){
  const lvl = side>0 ? a.orHi + RULES.ATR_K*atr : a.orLo - RULES.ATR_K*atr;

    jev: pDir!=null && pDir>=RULES.JEV_MIN,

}

/* ======================= CSV from Massive call_api ======================= */
function resultText(res){
  let p = res && (res.payload!==undefined ? res.payload : null);
  if(p && typeof p==='object' && typeof p.result==='string') return p.result;
  if(typeof p==='string'){ try{ const j=JSON.parse(p); if(j && typeof j.result==='string') return j.result; }catch(e){} return p; }
  const t = res && res.content && res.content.find(c=>c.type==='text');
  if(t){ try{ const j=JSON.parse(t.text); if(j && typeof j.result==='string') return j.result; }catch(e){} return t.text; }
  return '';
}
function splitRow(line){ const out=[]; let cur='', q=false, depth=0;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; continue; }
    if(ch==='"'){q=true;continue;} if(ch==='['||ch==='{')depth++; if(ch===']'||ch==='}')depth--;
    if(ch===','&&depth===0){out.push(cur);cur='';} else cur+=ch; }
  out.push(cur); return out; }
function parseCSV(text){
  const lines = text.split('\n'); const rows=[]; if(!lines.length) return rows;
  const head = splitRow(lines[0]); if(head.length<2) return rows;
  for(let i=1;i<lines.length;i++){ const ln=lines[i]; if(!ln.trim()) break; const c=splitRow(ln); const o={}; head.forEach((h,j)=>o[h]=c[j]); rows.push(o); }
  return rows;
}

/* ======================= Simulator ======================= */
const SEED = {NVDA:{px:221.1,atrPct:0.028}, TSLA:{px:371.6,atrPct:0.036}, SPY:{px:769.3,atrPct:0.011}, QQQ:{px:715.2,atrPct:0.0135}, AAPL:{px:340,atrPct:0.02}, MU:{px:915,atrPct:0.045}, PLTR:{px:197,atrPct:0.045}, SMCI:{px:37.5,atrPct:0.05}, AMD:{px:550,atrPct:0.04}, AVGO:{px:345,atrPct:0.03}, HOOD:{px:100,atrPct:0.055}};
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function genDay(sym, mkt){
  const s=SEED[sym], prevClose=s.px*(1+gauss()*0.004), atr=prevClose*s.atrPct;
  const beta = sym==='SPY'||sym==='QQQ' ? 1 : 1.6;
  const trend = Math.max(-1,Math.min(1, mkt*0.6 + gauss()*0.6));
  const gap = (mkt*0.004 + gauss()*0.006)*beta;
  let px = prevClose*(1+gap); const bars=[]; const sig = atr/24;
  for(let m=RULES.OPEN;m<15*60;m++){
    const early = m<9*60+30 ? 1.6 : 0.8;
    const drift = trend*atr*0.9/390*(m<11*60?1.6:0.7);
    const o=px; const c=o+drift+gauss()*sig*early; const h=Math.max(o,c)+Math.abs(gauss())*sig*0.5; const l=Math.min(o,c)-Math.abs(gauss())*sig*0.5;
    const v=Math.round((m<9*60?3:1)*(800000/ (s.px/100)) * (0.6+Math.random()));
    bars.push({min:m,o,h,l,c,v}); px=c;
  }
  const pUp = Math.max(0.05,Math.min(0.95, 0.5 + trend*0.28 + gauss()*0.08));
  return {sym, prevClose, atr, bars, pUp, spreadOk: Math.random()<0.85};
}

/* ======================= Alert sound ======================= */
let AC=null;
function audioOn(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return true; }catch(e){ return false; } }
function chaChing(){
  if(!AC) return; const t0=AC.currentTime+0.02; const out=AC.createGain(); out.gain.value=0.55; out.connect(AC.destination);
  // "cha": short bright noise burst (register drawer)
  const len=Math.floor(AC.sampleRate*0.09), buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);

  ns.connect(hp); hp.connect(ng); ng.connect(out); ns.start(t0);
  // "ching": two bell strikes with inharmonic partials
  [[t0+0.11,1],[t0+0.24,1.12]].forEach(([st,mul])=>{
    [[2093,1],[2637,0.6],[3520,0.45],[5274,0.25]].forEach(([f,a])=>{

      o.connect(g); g.connect(out); o.start(st); o.stop(st+0.95); });
  });
}
function techDing(){
  if(!AC) return; const t0=AC.currentTime+0.02; const out=AC.createGain(); out.gain.value=0.5; out.connect(AC.destination);

/* ======================= Small components ======================= */
const f2 = n => Number.isFinite(n) ? n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '–';
const pct = (n,d=1) => Number.isFinite(n) ? (n>=0?'+':'')+n.toFixed(d)+'%' : '–';

function Layer({name,pts,on,val,req}){
  return html`<div className=${'layer'+(on?' on':'')+(req?' req':'')} title=${req?'Required for GO IN':''}>

    <div className="lv num">${val}</div></div>`;
}

function Projections({c, side, entry, atr, fromMin}){
  if(!c) return null;
  const holdFrac = Math.max(0, (RULES.FLAT - (fromMin??RULES.WIN_START)))/390;
  const rows = [
    ['Stop hit (−0.5 ATR)', -RULES.STOP_ATR*atr, holdFrac*0.35],
    ['No move, flat at 2:40', 0, holdFrac],
    ['+0.5 ATR by 2:40', 0.5*atr, holdFrac],
    ['+1.0 ATR by 2:40', 1.0*atr, holdFrac],
    ['+1.5 ATR by 2:40', 1.5*atr, holdFrac]
  ];
  return html`<div className="tbl"><table>
    <thead><tr><th>Scenario</th><th>Stock at</th><th>Option est.</th><th>Per contract</th><th>Return</th></tr></thead>
    <tbody>${rows.map(([lbl,m,hf])=>{ const v=project(c,m,hf); const r=(v/c.mid-1)*100; return html`<tr key=${lbl}>
      <td style=${{fontFamily:'var(--f-body)'}}>${lbl}</td><td>${f2(entry+side*m)}</td><td>${f2(v)}</td>
      <td className=${r>=0?'up':'dn'}>${(r>=0?'+$':'−$')+Math.abs((v-c.mid)*100).toFixed(0)}</td><td className=${r>=0?'up':'dn'}>${pct(r)}</td></tr>`; })}</tbody>
  </table></div>`;
}

function MiniChart({a, sc, trade, side}){

  const Wd=600, H=120, Hf=40, x0=a.premarket?ser[0].m:RULES.OPEN, x1=a.premarket?Math.max(ser[0].m+30,a.lastMin+5):Math.min(15*60, Math.max(RULES.OPEN+90, a.lastMin+30));

  const vals = ser.map(p=>p.c).concat(lines.map(l=>l[0]));

  </div>`;

// Contracts by dollar budget: as many as fit (max 3), never fewer than 1
function sizeBudget(c, budget){
  if(!c || !(c.mid>0)) return null; const per=c.mid*100; const fit=Math.floor((budget||0)/per);
  const n=Math.max(1, Math.min(3, fit)); return {n, per, cost:n*per, over: fit<1};
}

const TIER_CLS = {'GO IN':'go','5-MIN':'five','TECH GO':'tech'};
function playMoney(t, x, budget){
  const a=t.a; const prem=x.premEntry; if(!(prem>0)) return {n:null, pnl:null, est:true};
  const n = x.contracts || sizeBudget({mid:prem}, x.budget||budget).n;
  const ct = x.contract || t.contract; let v=null, est=true;
  if(x.exit!=null){ if(x.premExit>0){ v=x.premExit; est=!!(ct&&ct.est); } else if(ct){ v=project({...ct, mid:prem}, x.side*(x.exit-x.entry), (x.exitMin-x.entryMin)/390); } }
  else if(x.liveMid>0){ v=x.liveMid; est=false; }
  else if(ct && a){ v=project({...ct, mid:prem}, x.side*(a.price-x.entry), Math.max(0,a.lastMin-x.entryMin)/390); }
  return {n, pnl: v!=null ? Math.round(n*(v-prem)*100) : null, est, opt: v};
}
function gatherPlays(T){
  const out=[];
  for(const sym of ALL){ const t=T[sym]; if(!t || !t.a) continue;
    const add=(x,tier,extra)=>{ if(x) out.push({sym, t, x, tier, ...(extra||{})}); };
    for(const p of (t.past||[])) add(p, p.kind, {upgraded:p.upgraded});
    add(t.trade,'GO IN'); add(t.shadow,'TECH GO',{upgraded: !!t.trade && !!t.shadow}); add(t.five,'5-MIN');
  }
  return out;
}

const BTGOOD = s => { const r=BT11.win[s]; return r ? (r[3]>=1.2?'good':(r[3]<0.8?'bad':'mid')) : 'mid'; };
function ladderRows(T){
  return ALL.map(sym=>{ const t=T[sym]; if(!t||!t.a) return {sym, g:9, k:[], t};
    const a=t.a, sc=t.sc, tr=t.trade, atr=t.atr||1; const ver=PRIMARY.includes(sym)?0:1;
    const f5 = t.five && t.five.exit==null ? t.five : null;
    const side = tr && tr.exit==null ? tr.side : (f5 ? f5.side : (tr? tr.side : (sc?sc.side:1)));
    const pDir = t.pUp==null?0:(side>0?t.pUp:1-t.pUp);
    const strength = Math.max(0,Math.abs(a.flowPct)-RULES.FLOW_PCT) + Math.max(0,pDir-RULES.JEV_MIN);
    const dist = sc && a.orReady ? Math.max(0, side>0 ? (sc.lvl-a.price)/atr : (a.price-sc.lvl)/atr) : null;
    const req = sc ? (sc.L.flow?1:0)+(sc.L.jev?1:0) : 0;
    let g, k;
    if(tr && tr.exit==null){ g=0; k=[ver, tr.prime?0:1, -strength]; }
    else if(f5){ g=0.25; k=[ver, f5.prime?0:1, -strength]; }
    else if(!tr && t.shadow && t.shadow.exit==null){ g=0.5; k=[ver, t.shadow.prime?0:1, -strength]; }
    else if(!tr && sc && (req>=1 || sc.score>=60) && !a.premarket && a.lastMin<=MON_END){ g=1; k=[-req, dist??9, -sc.score, ver]; }
    else if(tr){ g=3; k=[ver]; }
    else { g=2; k=[-(sc?sc.score:0), ver]; }
    return {sym, g, k, t, side, dist, req, strength};
  }).sort((x,y)=>{ if(x.g!==y.g) return x.g-y.g; for(let i=0;i<Math.max(x.k.length,y.k.length);i++){ const d=(x.k[i]??0)-(y.k[i]??0); if(d) return d; } return 0; });
}
function cardOrder(T){
  const rows=ladderRows(T); const rank=r=> r.g<=1 ? rows.indexOf(r) : 100+ALL.indexOf(r.sym)+(r.g===3?50:0);
  return rows.slice().sort((x,y)=>rank(x)-rank(y)).map(r=>r.sym);
}

function prevWeekday(d){ let x=shiftDays(d,-1); while([0,6].includes(new Date(x+'T12:00:00Z').getUTCDay())) x=shiftDays(x,-1); return x; }

/* ======================= Day scorecard (simulation and replay) ======================= */
function scoreRows(T, budget, realOpt){
  const out=[];
  for(const sym of ALL){ const t=T[sym]; if(!t) continue; const atr=t.atr||1;
    const mk=(tier, x, c, prem, extra)=>{ if(!x) return;
      const done=x.exit!=null; const px=done?x.exit:(t.a?t.a.price:x.entry);
      const r=x.side*(px-x.entry)/(RULES.STOP_ATR*atr); const stockPct=x.side*(px/x.entry-1)*100;
      let estPct=null; if(c && prem){ const v=project({...c, mid:prem}, x.side*(px-x.entry), ((done?x.exitMin:(t.a?t.a.lastMin:x.entryMin))-x.entryMin)/390); estPct=(v/prem-1)*100; }
      const z = prem ? sizeBudget({mid:prem}, budget) : null; const n = (extra&&extra.contracts) || (z?z.n:1);
      const ro = realOpt[sym+'|'+tier+'|'+(x.n||1)];
      const optPct = ro && ro.pct!=null ? ro.pct : estPct;
      const dollars = ro && ro.pct!=null ? ro.n*(ro.p1-ro.p0)*100 : (prem&&estPct!=null ? n*prem*estPct : null);
      const fadePct = x.fade ? x.fade.optPct : (x.fade===null ? optPct : null);
      out.push({fadePct, fadeMin: x.fade?x.fade.min:null, sym, tier, n:x.n||1, side:x.side, entryMin:x.entryMin, entry:x.entry, exit:done?x.exit:null, exitMin:x.exitMin, reason:done?x.reason:'holding', r, stockPct, optPct, real:!!(ro&&ro.pct!=null), ro, dollars, prime: x.entryMin<=RULES.WIN_END, upgraded: tier==='TECH GO' && (extra&&extra.upgraded!=null ? extra.upgraded : !!t.trade)}); };
    for(const p of (t.past||[])) mk(p.kind, p, p.contract||t.contract, p.premEntry, {contracts:p.contracts, upgraded:!!p.upgraded});
    if(t.trade) mk('GO IN', t.trade, t.contract, t.trade.premEntry, {contracts:t.trade.contracts});
    if(t.shadow) mk('TECH GO', t.shadow, t.shadow.contract, t.shadow.premEntry, null);
    if(t.five) mk('5-MIN', t.five, t.five.contract, t.five.premEntry, {contracts:t.five.contracts});
  }
  return out.sort((a,b)=>a.entryMin-b.entryMin);
}
function Scorecard({T, budget, realOpt, mode, done}){

  const grp=(f)=>{ const g=rows.filter(f); const c=g.filter(r=>r.exit!=null && r.optPct!=null); const w=c.filter(r=>r.optPct>0);

  const money=v=>v==null?'–':(v>=0?'+$':'−$')+Math.abs(Math.round(v)).toLocaleString('en-US');
  return html`<section className="panel" id="scorecard">
    <div className="row"><h2>Day scorecard</h2><span className="note">${mode==='replay'?'Real prices for that day. Option results use real contract trades where available, otherwise estimates.':'Simulated prices. Option results are estimates.'} Never written to the paper log.</span></div>

function unwrapPayload(r){
  let p = r && r.payload!==undefined ? r.payload : (r && r.structuredContent);
  if(typeof p==='string'){ try{ p=JSON.parse(p); }catch(e){} }
  if(p && !Array.isArray(p) && typeof p==='object'){ for(const k of ['result','data','orders','items','accounts']) if(Array.isArray(p[k])) return p[k]; }
  return p;
}
// Pair Webull option fills into round trips (FIFO per contract)
function roundTrips(combos){
  const fills=[];
  for(const c of combos||[]) for(const o of (c.orders||[])){
    if(o.status!=='FILLED' || o.instrument_type!=='OPTION') continue; const leg=(o.legs||[])[0]; if(!leg) continue;
    const fees=(o.fees||[]).reduce((a,f)=>a+(+f.actual_value||0),0);
    fills.push({id:o.order_id, sym:o.symbol||leg.symbol, type:(leg.option_type||'').toLowerCase(), strike:+leg.strike_price, expiry:leg.option_expire_date,
      side:o.side, qty:+o.filled_quantity||+leg.quantity||0, px:+o.filled_price, t:+o.filled_time||Date.parse(o.filled_time_at), fees, mult:+leg.option_contract_multiplier||100});
  }
  fills.sort((a,b)=>a.t-b.t);
  const open={}, trips=[];
  for(const f of fills){ const k=f.sym+'|'+f.type+'|'+f.strike+'|'+f.expiry;
    if(f.side==='BUY'){ (open[k]=open[k]||[]).push({...f, left:f.qty}); continue; }
    let q=f.qty; const feePer=f.fees/(f.qty||1);
    while(q>0 && open[k] && open[k].length){ const b=open[k][0]; const n=Math.min(q,b.left);
      const fees=b.fees*(n/b.qty)+feePer*n;
      trips.push({id:b.id+'-'+f.id+(n!==b.qty?'-'+n:''), sym:f.sym, type:f.type, strike:f.strike, expiry:f.expiry, qty:n, openTime:b.t, closeTime:f.t, entryPx:b.px, exitPx:f.px,
        fees:+fees.toFixed(2), pl:+(((f.px-b.px)*n*f.mult)-fees).toFixed(2), plPct:+((f.px/b.px-1)*100).toFixed(2), status:'closed'});
      b.left-=n; q-=n; if(b.left<=0) open[k].shift(); }
  }
  for(const k in open) for(const b of open[k]) if(b.left>0) trips.push({id:b.id+'-open', sym:b.sym, type:b.type, strike:b.strike, expiry:b.expiry, qty:b.left, openTime:b.t, closeTime:null, entryPx:b.px, exitPx:null, fees:+b.fees.toFixed(2), pl:null, plPct:null, status:'open'});
  return trips;
}
function matchSignal(tr, paper){
  const d=ctParts(tr.openTime).date, side = tr.type==='call'?1:-1;
  const sigs = paper.filter(p=>p.date===d && p.sym===tr.sym && p.side===side && (p.source==='live' || p.source==='five'));
  if(!sigs.length) return {tag:'off-plan', cls:'dn'};
  const at = p => p.goAt || p.fiveAt || null;
  const sig = sigs.slice().sort((x,y)=>Math.abs(tr.openTime-(at(x)||0))-Math.abs(tr.openTime-(at(y)||0)))[0];
  const nm = sig.source==='five' ? '5-MIN' : 'GO IN';
  const goMs = at(sig); if(!goMs) return {tag:'on '+nm, cls:'up'};
  const lag = Math.round((tr.openTime-goMs)/60000);
  return lag<=5 ? {tag:'on '+nm+(lag>0?' +'+lag+'m':''), cls:'up'} : {tag:'late '+lag+'m after '+nm, cls:''};
}

function Curve({rows}){
  const Wd=600,H=90; if(rows.length<2) return html`<div className="note">The curve appears after two closed trades.</div>`;
  let cum=0; const pts=rows.map((r,i)=>{cum+=r.optPct||0; return [i,cum];});
  const mn=Math.min(0,...pts.map(p=>p[1])), mx=Math.max(0,...pts.map(p=>p[1])); const sx=i=>8+(i/(pts.length-1))*(Wd-16); const sy=v=>H-8-((v-mn)/((mx-mn)||1))*(H-16);
  return html`<svg className="curve" viewBox=${'0 0 '+Wd+' '+H} preserveAspectRatio="none" role="img" aria-label="Cumulative option return across paper trades">
    <line x1="0" x2=${Wd} y1=${sy(0)} y2=${sy(0)} stroke="var(--line-2)" strokeDasharray="4 4"/>
    <polyline points=${pts.map(p=>sx(p[0])+','+sy(p[1])).join(' ')} fill="none" stroke=${cum>=0?'var(--go)':'var(--warn)'} strokeWidth="2" vectorEffect="non-scaling-stroke"/>
    <circle cx=${sx(pts.length-1)} cy=${sy(cum)} r="3.5" fill=${cum>=0?'var(--go)':'var(--warn)'}/></svg>`;
}

/* Dollar P&L for any paper row: uses stored contracts, else sizes the play with the budget the same way GO IN is sized */
function paperNorm(r, budget, exitRule){
  const fadeOn = exitRule==='fade' && r.fadeDone && r.fade && Number.isFinite(r.fade.optPct);
  const p0 = r.premEntry, p1 = fadeOn ? r.fade.prem : r.premExit;
  const n = r.contracts || (p0>0 ? sizeBudget({mid:p0}, r.budget||budget).n : null);
  const pctv = fadeOn ? r.fade.optPct : r.optPct;
  const usd = (n && p0>0 && p1>0) ? Math.round((p1-p0)*100*n) : (r.source==='manual' && Number.isFinite(r.dollarPL) ? r.dollarPL : null);
  return {...r, contracts:n, optPct:pctv, dollarPL:usd, premExit: fadeOn ? r.fade.prem : r.premExit};
}
const usdTxt = v => (v>=0?'+$':'−$')+Math.abs(v).toLocaleString('en-US');

        rows.slice().sort((a,b)=>a.date<b.date?1:-1).map(r=>html`<tr key=${r.id}>
          <td>${r.date}</td><td>${r.sym}${PRIMARY.includes(r.sym)?' ✓':''}</td><td>${isPrime(r)?'prime':'after 9'}${r.entryMin!=null?' · '+hm(r.entryMin):''}${(r.n||1)>1?' · play #'+r.n:''}</td><td>${r.side>0?'calls':'puts'}</td><td>${f2(r.entry)}</td><td>${r.exit!=null?f2(r.exit):'open'}</td>
          <td>${r.status==='open'?'holding':(r.exitReason||'')}</td><td className=${(r.stockPct??0)>=0?'up':'dn'}>${r.stockPct!=null?pct(r.stockPct,2):'–'}</td>
          <td>${r.premEntry?('$'+f2(r.premEntry)+(r.premExit?' → $'+f2(r.premExit):'')):'–'}</td>
          <td className=${(r.optPct??0)>=0?'up':'dn'}>${r.optPct!=null?pct(r.optPct):'–'}</td>
          <td className=${r.fade&&r.fade.optPct!=null?(r.fade.optPct>=0?'up':'dn'):''}>${r.fade ? (r.fade.optPct!=null?pct(r.fade.optPct):'') +' · '+hm(r.fade.min) : (r.fadeDone?'no fade':'–')}</td><td>${r.contracts??'–'}</td>
          <td className=${(r.dollarPL??0)>=0?'up':'dn'}>${r.dollarPL!=null?((r.dollarPL>=0?'+$':'−$')+Math.abs(r.dollarPL).toLocaleString('en-US')):'–'}</td><td className=${r.source==='five'?'five':(r.source==='shadow'?'amb':'')}>${({live:'GO IN',shadow:'TECH GO',five:'5-MIN',manual:'manual'})[r.source]||r.source||''}</td>
          <td><button className="ghost" onClick=${()=>del(r)} aria-label=${'Delete '+r.sym+' '+r.date}>Delete</button></td></tr>`)}</tbody>
    </table></div>
    <div className="form">
      <label>Date<input id="pf-date" type="date" value=${form.date} onChange=${e=>setForm({...form,date:e.target.value})}/></label>
      <label>Ticker<select id="pf-sym" value=${form.sym} onChange=${e=>setForm({...form,sym:e.target.value})}>${ALL.map(x=>html`<option key=${x}>${x}</option>`)}</select></label>
      <label>Side<select id="pf-side" value=${form.side} onChange=${e=>setForm({...form,side:e.target.value})}><option value="calls">calls</option><option value="puts">puts</option></select></label>
      <label>Stock entry<input id="pf-entry" inputMode="decimal" value=${form.entry} onChange=${e=>setForm({...form,entry:e.target.value})}/></label>
      <label>Stock exit<input id="pf-exit" inputMode="decimal" value=${form.exit} onChange=${e=>setForm({...form,exit:e.target.value})}/></label>
      <label>Exit reason<select id="pf-reason" value=${form.reason} onChange=${e=>setForm({...form,reason:e.target.value})}><option value="flat">flat 2:40</option><option value="stop">stop</option><option value="target">target</option><option value="manual">closed early</option></select></label>
      <label>Window<select id="pf-prime" value=${form.prime} onChange=${e=>setForm({...form,prime:e.target.value})}><option value="yes">prime 8:45–9:00</option><option value="no">after 9:00</option></select></label>
      <label>Premium paid<input id="pf-p0" inputMode="decimal" value=${form.prem0} onChange=${e=>setForm({...form,prem0:e.target.value})}/></label>
      <label>Premium at exit<input id="pf-p1" inputMode="decimal" value=${form.prem1} onChange=${e=>setForm({...form,prem1:e.target.value})}/></label>
      <label>Contracts<input id="pf-qty" inputMode="numeric" value=${form.qty} onChange=${e=>setForm({...form,qty:e.target.value})}/></label>
      <button className="primary" onClick=${save}>Add trade</button>
      <span className="note" style=${{gridColumn:'span 2'}}>${msg}</span>
    </div>
  </section>`;
}

/* ======================= App ======================= */
function App(){
  const [mode,setMode]=useState('live');               // sim | live
  const [mcp,setMcp]=useState(null);
  const [btView,setBtView]=useState('win');
  const [db,setDb]=useState(null);
  const [dbState,setDbState]=useState('Connecting to the log…');
  const [paper,setPaper]=useState([]);
  const [real,setReal]=useState([]);
  const [syncMsg,setSyncMsg]=useState('');
  const [tick,setTick]=useState(0);
  const [toasts,setToasts]=useState([]);
  const [liveMsg,setLiveMsg]=useState('');
  const [busy,setBusy]=useState(false);
  const [simRun,setSimRun]=useState(false);
  const [simSpeed,setSimSpeed]=useState(20);           // simulated minutes per second
  const [simLog,setSimLog]=useState([]);
  const [replayDate,setReplayDate]=useState(()=>prevWeekday(ctParts(Date.now()).date));
  const [replayMsg,setReplayMsg]=useState('');
  const [realOpt,setRealOpt]=useState({});
  const optPending=useRef({});
  const [budget,setBudget]=useState(()=>{ try{ const v=+localStorage.getItem('ce-budget'); return v>0?v:1700; }catch(e){ return 1700; } });
  const budgetRef=useRef(budget); budgetRef.current=budget;
  const [sound,setSound]=useState(()=>{ try{ return localStorage.getItem('ce-sound')||'off'; }catch(e){ return 'off'; } });
  const [soundReady,setSoundReady]=useState(false);
  const [techSound,setTechSound]=useState(()=>{ try{ return localStorage.getItem('ce-techsound')!=='off'; }catch(e){ return true; } });
  const techSoundRef=useRef(techSound); techSoundRef.current=techSound;
  useEffect(()=>{ try{ localStorage.setItem('ce-techsound', techSound?'on':'off'); }catch(e){} },[techSound]);
  const [fiveSound,setFiveSound]=useState(()=>{ try{ return localStorage.getItem('ce-fivesound')!=='off'; }catch(e){ return true; } });
  const fiveSoundRef=useRef(fiveSound); fiveSoundRef.current=fiveSound;
  useEffect(()=>{ try{ localStorage.setItem('ce-fivesound', fiveSound?'on':'off'); }catch(e){} },[fiveSound]);
  const [detail,setDetail]=useState(()=>{ try{ return localStorage.getItem('ce-detail')||'simple'; }catch(e){ return 'simple'; } });
  useEffect(()=>{ try{ localStorage.setItem('ce-detail', detail); }catch(e){} },[detail]);
  const [muteUntil,setMuteUntil]=useState(()=>{ try{ return +localStorage.getItem('ce-mute')||0; }catch(e){ return 0; } });
  useEffect(()=>{ try{ localStorage.setItem('ce-mute', String(muteUntil)); }catch(e){} },[muteUntil]);
  const muted = muteUntil>Date.now();
  const soundRef=useRef(sound); soundRef.current = (soundReady && !muted) ? sound : 'off';
  useEffect(()=>{ try{ localStorage.setItem('ce-sound', sound); }catch(e){} },[sound]);
  const pickSound = (v)=>{ setSound(v); if(v!=='off'){ const ok=audioOn(); setSoundReady(ok); if(ok){ chaChing(); if(v==='voice') sayGo('NVDA',1); } } };
  const armSound = ()=>{ const ok=audioOn(); setSoundReady(ok); if(ok) chaChing(); };
  useEffect(()=>{ try{ localStorage.setItem('ce-budget', String(budget)); }catch(e){} },[budget]);
  const S = useRef({}); // per-ticker state
  const sim = useRef(null);
  const flashUntil = useRef({});

  const toast=(text,kind)=>{ const id=Math.random(); setToasts(x=>[...x,{id,text,kind}].slice(-3)); setTimeout(()=>setToasts(x=>x.filter(z=>z.id!==id)),3200); };

  // capabilities
  useEffect(()=>{ let off=null;
    (async()=>{
      const c = window.claude; if(!c||!c.use){ setDbState('Log unavailable in this view'); return; }
      c.use('mcp').then(m=>setMcp(m)).catch(()=>{});
      const d = await c.use('db').catch(()=>null);
      if(!d){ setDbState('Log unavailable in this view (sign in to claude.ai to keep paper trades)'); return; }
      setDb(d); setDbState('Saved to this dashboard');
      off = d.collection('paper').onSnapshot(snap=>{ setPaper(snap.docs.map(x=>({id:x.id,...x.data()}))); }, e=>setDbState('Log stopped updating ('+e.code+')'));
      const off2 = d.collection('real').onSnapshot(snap=>{ setReal(snap.docs.map(x=>({id:x.id,...x.data()}))); }, ()=>{});
      const o1=off; off=()=>{ o1&&o1(); off2&&off2(); };
    })();
    return ()=>{ if(off) off(); };
  },[]);

  /* ---------- engine step for one ticker ---------- */
  const evaluate = useCallback((t, nowMin, persist, persistShadow, persistFive)=>{
    if(!t.a){ t.status='IDLE'; return; }
    const a=t.a;
    const pfOf = k => k==='trade' ? persist : (k==='five' ? persistFive : persistShadow);
    // Volume-fade flag: first minute after entry where net volume delta is back under +/-5% (before the play's own exit)
    const fadeCheck = (x, ct, kind)=>{
      if(!x || x.fade!==undefined || !a.series || !t.atr || a.premarket) return;
      const pf = pfOf(kind);
      const q = a.series.find(p=>p.m>x.entryMin && x.side*p.f < RULES.FADE && (x.exitMin==null || p.m<x.exitMin));
      if(!q){ if(x.exit!=null){ x.fade=null; pf&&pf(t); } return; }
      const px=a.closeAt(q.m); const R=x.side*(px-x.entry)/(RULES.STOP_ATR*t.atr);
      let prem=null, real=false;
      if(x.exit==null && x.liveMid && a.lastMin-q.m<=1 && ct && !ct.est){ prem=x.liveMid; real=true; }
      else if(ct && x.premEntry){ prem=project({...ct, mid:x.premEntry}, x.side*(px-x.entry), (q.m-x.entryMin)/390); }
      x.fade={min:q.m, px, R, prem, real, optPct: prem&&x.premEntry ? (prem/x.premEntry-1)*100 : null, at: t.sim?null:Date.now()};
      if(x.exit==null){
        flashUntil.current[t.sym]=Date.now()+2600; toast(t.sym+' · '+(kind==='five'?'5-MIN · ':(kind==='shadow'?'TECH GO · ':''))+'VOLUME FADED · fade exit '+f2(px)+' ('+(R>=0?'+':'')+R.toFixed(2)+'R)','flat');
        if(soundRef.current!=='off'){ fadeTone(); if(soundRef.current==='voice') sayFade(t.sym); }
      }
      pf&&pf(t);
    };
    fadeCheck(t.trade, t.contract, 'trade');
    fadeCheck(t.shadow, t.shadow && t.shadow.contract, 'shadow');
    fadeCheck(t.five, t.five && t.five.contract, 'five');
    for(const x of [t.trade, t.shadow, t.five]) if(x && x.fade && !(x.ev||[]).some(e=>e.type==='fade')) (x.ev=x.ev||[]).push({m:x.fade.min, type:'fade', R:x.fade.R, px:x.fade.px, msg:'Volume faded under 5%: candidate exit'});
    // Live play monitor: take-profit levels, give-back, near stop and abnormal candles against the play (alerts only; exits unchanged)
    const monitor = (x, kind, tier)=>{
      if(!x || x.exit!=null || a.premarket || !t.atr || !a.series || !a.series.length) return;
      const R = x.side*(a.price-x.entry)/(RULES.STOP_ATR*t.atr); x.maxR=Math.max(x.maxR||0, R); x.ev=x.ev||[];
      const has = k => x.ev.some(e=>e.type===k);
      const tag = tier==='GO IN' ? '' : tier+' · ';
      const fire = (type, msg, kindT, tone, voice)=>{ x.ev.push({m:a.lastMin, type, R, px:a.price, msg}); toast(t.sym+' · '+tag+msg, kindT); flashUntil.current[t.sym]=Date.now()+2600;
        if(soundRef.current!=='off'){ tone(); if(soundRef.current==='voice') sayLine(spell(t.sym)+(tier==='5-MIN'?', five minute play':'')+', '+voice); }
        const r = kind==='trade' ? persistRef.current : (kind==='five' ? persistFiveRef.current : persistShadowRef.current); r&&r(t); };
      if(R>=1 && !has('tp1')) fire('tp1', 'TAKE PROFIT 1 · +1R at '+f2(a.price)+' · consider selling part', '', tpTone, 'plus one R, consider taking partial profit');
      if(R>=2 && !has('tp2')) fire('tp2', 'TAKE PROFIT 2 · +2R at '+f2(a.price)+' · consider locking in more', '', tpTone, 'plus two R, consider locking in');
      if(x.maxR>=1 && R<=0.25 && !has('give')) fire('give', 'GIVING BACK · was +'+x.maxR.toFixed(1)+'R, now '+(R>=0?'+':'')+R.toFixed(2)+'R · consider exit near entry', 'flat', fadeTone, 'giving back gains, consider exit near entry');
      if(R<=-0.7 && !has('nearstop')) fire('nearstop', 'NEAR STOP · '+R.toFixed(2)+'R · stop '+f2(x.stop), 'stop', fadeTone, 'near stop');
      const ser=a.series, b=ser[ser.length-1], pb=ser[ser.length-2];
      if(b && pb && b.m>x.entryMin && ser.length>20){
        const avgR = ser.reduce((s2,q)=>s2+(q.h-q.l),0)/ser.length, avgV = ser.reduce((s2,q)=>s2+q.v,0)/ser.length;
        const lastAbn = Math.max(-99, ...x.ev.filter(e=>e.type==='abn').map(e=>e.m));
        if((b.h-b.l)>=2.5*avgR && b.v>=2*avgV && x.side*(b.c-pb.c)<0 && b.m-lastAbn>=10)
          fire('abn', 'ABNORMAL CANDLE AGAINST · '+hm(b.m)+' · range '+((b.h-b.l)/avgR).toFixed(1)+'x, volume '+(b.v/avgV).toFixed(1)+'x · consider exit', 'stop', fadeTone, 'abnormal candle against the play, consider exit');
      }
    };
    // Exit alert (sound + voice) for any play
    const exitAlert = (x, tier, soundOn)=>{
      const word = {stop:'STOPPED',target:'TARGET HIT',flat:'FLAT 2:40'}[x.reason]||'CLOSED';
      toast(t.sym+' · '+tier+' '+word+' · '+f2(x.exit), x.reason==='stop'?'stop':(x.reason==='flat'?'flat':(tier==='5-MIN'?'five':(tier==='TECH GO'?'tech':''))));
      flashUntil.current[t.sym]=Date.now()+2600;
      if(soundOn && soundRef.current!=='off'){ (x.reason==='target'?tpTone:(x.reason==='stop'?stopTone:fadeTone))();
        if(soundRef.current==='voice') sayLine(spell(t.sym)+', '+(tier==='5-MIN'?'five minute play':(tier==='TECH GO'?'tech GO':'GO IN'))+', '+({stop:'stopped out',target:'target hit',flat:'flat at two forty'}[x.reason]||'closed')); }
    };
    const lateOf = m => !t.sim && (ctParts(Date.now()).min - m) > 3;
    // Close an open play at its stop, target or 2:40 and price the option exit
    const closePlay = (x, tier, soundOn, pf)=>{
      const sMin=a.firstCross(x.entryMin, x.stop, x.side>0), tMin=a.firstCross(x.entryMin, x.tp, x.side<0);
      if(sMin!=null && (tMin==null||sMin<=tMin)){ x.exit=x.stop; x.exitMin=sMin; x.reason='stop'; }
      else if(tMin!=null){ x.exit=x.tp; x.exitMin=tMin; x.reason='target'; }
      else if(a.lastMin>=RULES.FLAT){ x.exit=a.closeAt(RULES.FLAT); x.exitMin=RULES.FLAT; x.reason='flat'; }
      if(x.exit==null) return false;
      if(x.liveMid && x.contract && !x.contract.est && !lateOf(x.exitMin)){ x.premExit=x.liveMid; x.optPct=(x.liveMid/x.premEntry-1)*100; }
      else if(x.contract && x.premEntry){ const v=project({...x.contract, mid:x.premEntry}, x.side*(x.exit-x.entry), (x.exitMin-x.entryMin)/390); x.premExit=v; x.optPct=(v/x.premEntry-1)*100; }
      if(!lateOf(x.exitMin)) exitAlert(x, tier, soundOn); pf&&pf(t); return true;
    };
    monitor(t.trade, 'trade', 'GO IN');
    if(!t.trade) monitor(t.shadow, 'shadow', 'TECH GO');
    monitor(t.five, 'five', '5-MIN');
    // 5-MIN confirmation play: the 5-minute candle (8:45-8:49, 8:50-8:54, ...) closes beyond the trigger with volume delta past +/-10%.
    // Its own entry, stop (-0.5 ATR), target (+1.5 ATR) and 2:40 flat; does not need Jev (Jev is recorded for comparison).
    if(a.orReady && !a.premarket && t.atr && a.series && a.series.length){
      const up=a.orHi+RULES.ATR_K*t.atr, dn=a.orLo-RULES.ATR_K*t.atr;
      const is5 = m => (m-RULES.OPEN)%5===4;
      const nowM = t.sim ? Infinity : ctParts(Date.now()).min;   // live: only candles that have fully closed
      const done5 = p => p.m < nowM && p.m <= a.lastMin;
      if(t.five && t.five.exit==null) closePlay(t.five, '5-MIN', fiveSoundRef.current, persistFive);
      if(t.five && t.five.exit!=null && (t.n5||1)<3){
        const q=a.series.find(p=>p.m>=t.five.exitMin+15 && p.m<=MON_END && is5(p.m) && done5(p) && p.c<up && p.c>dn);
        if(q){ t.past=t.past||[]; t.past.push({...t.five, kind:'5-MIN'}); t.five=null; t.n5=(t.n5||1)+1; t.from5=q.m+1; if(!lateOf(q.m)) toast(t.sym+' · 5-MIN re-armed · watching for play #'+t.n5,'ref'); }
      }
      if(!t.five){
        const from=Math.max(RULES.WIN_START, t.from5||0);
        const q=a.series.find(p=>p.m>=from && p.m<=MON_END && is5(p.m) && done5(p) && ((p.c>up && p.f>=RULES.FLOW_PCT) || (p.c<dn && p.f<=-RULES.FLOW_PCT)));
        if(q && TRADE.has(t.sym)){
          const sd = q.c>up ? 1 : -1, entry=q.c, late=lateOf(q.m);
          const pDir = t.pUp==null ? null : (sd>0?t.pUp:1-t.pUp);
          const useLive = t.contract && t.contract.side===sd && !t.contract.est;
          const c = useLive ? t.contract : (()=>{ const e=estContract(entry,t.atr,sd,t.date); e.ticker=occ(t.sym,e.expiry,sd,e.strike); return {...e,side:sd}; })();
          // a live quote is for the current price: shift it back to the candle-close price with delta
          const prem = useLive ? Math.max(0.01, c.mid + (Number.isFinite(c.delta)?c.delta:0.5*sd)*(entry-a.price)) : c.mid;
          const one = t.trade ? t.trade : null;
          t.five={side:sd, entry, entryMin:q.m, barStart:q.m-4, stop:entry-sd*RULES.STOP_ATR*t.atr, tp:entry+sd*RULES.TP_ATR*t.atr, exit:null, prime:q.m<=RULES.WIN_END,
            pDir, jevOk: pDir!=null && pDir>=RULES.JEV_MIN, flow:q.f, n:t.n5||1, ev:[], fiveAt: (t.sim||late)?null:Date.now(), late, routed: !!t.sim,
            oneMin: one ? {entryMin:one.entryMin, entry:one.entry, side:one.side} : null,
            contract:{ticker:c.ticker, expiry:c.expiry, strike:c.strike, delta:c.delta, gamma:c.gamma, theta:c.theta, mid:prem, est:!!c.est}, premEntry:prem};
          { const z=sizeBudget({mid:prem}, budgetRef.current); t.five.contracts=z?z.n:null; t.five.budget=budgetRef.current; }
          if(!late){
            flashUntil.current[t.sym]=Date.now()+2600;
            toast(t.sym+' · 5-MIN GO '+(sd>0?'CALLS':'PUTS')+' · '+hm(q.m-4)+' candle closed '+(sd>0?'above':'below')+' '+f2(sd>0?up:dn)+((t.n5||1)>1?' · play #'+t.n5:''),'five');
            if(soundRef.current!=='off' && fiveSoundRef.current){ fiveTone(); if(soundRef.current==='voice') sayFive(t.sym, sd); }
          }
          persistFive&&persistFive(t);
          closePlay(t.five, '5-MIN', fiveSoundRef.current, persistFive);   // a reconstructed play may already have closed
        }
      }
    }
    // Re-arm after a play closes: 15-minute cooldown and price back between the triggers, up to 3 plays per ticker per day
    {
      const open = (t.trade&&t.trade.exit==null) || (t.shadow&&t.shadow.exit==null);
      if((t.trade||t.shadow) && !open && (t.n||1)<3 && a.orReady && !a.premarket && a.lastMin<MON_END && t.atr){
        const lastExit = Math.max(t.trade&&t.trade.exitMin||0, t.shadow&&t.shadow.exitMin||0);
        const up=a.orHi+RULES.ATR_K*t.atr, dn=a.orLo-RULES.ATR_K*t.atr;
        if(a.lastMin>=lastExit+15 && a.price<up && a.price>dn){
          t.past=t.past||[];
          if(t.trade) t.past.push({...t.trade, kind:'GO IN'});
          if(t.shadow) t.past.push({...t.shadow, kind:'TECH GO', upgraded: !!t.trade});
          t.trade=null; t.shadow=null; t.n=(t.n||1)+1; t.sc=null;
          toast(t.sym+' · re-armed · watching for play #'+t.n,'ref');
        }
      }
    }
    // Shadow signal: price + volume passed but Jev did not. Tracked to stop/target/2:40 for comparison, never a GO.
    if(t.shadow && t.shadow.exit==null && a.orReady && !a.premarket){
      const sh=t.shadow; const sMin=a.firstCross(sh.entryMin, sh.stop, sh.side>0), tMin=a.firstCross(sh.entryMin, sh.tp, sh.side<0);
      if(sMin!=null && (tMin==null||sMin<=tMin)){ sh.exit=sh.stop; sh.exitMin=sMin; sh.reason='stop'; }
      else if(tMin!=null){ sh.exit=sh.tp; sh.exitMin=tMin; sh.reason='target'; }
      else if(a.lastMin>=RULES.FLAT){ sh.exit=a.closeAt(RULES.FLAT); sh.exitMin=RULES.FLAT; sh.reason='flat'; }
      if(sh.exit!=null){ if(!lateOf(sh.exitMin)) exitAlert(sh, 'TECH GO', techSoundRef.current); if(sh.liveMid && sh.contract && !sh.contract.est){ sh.premExit=sh.liveMid; sh.optPct=(sh.liveMid/sh.premEntry-1)*100; } else if(sh.contract){ const v=project(sh.contract, sh.side*(sh.exit-sh.entry), (sh.exitMin-sh.entryMin)/390); sh.premExit=v; sh.optPct=(v/sh.premEntry-1)*100; } persistShadow&&persistShadow(t); }
    }
    if(TRADE.has(t.sym) && !t.shadow && !t.trade && a.orReady && !a.premarket && a.lastMin>=RULES.WIN_START && a.lastMin<=MON_END && t.atr){
      for(const sd of [1,-1]){ const x=score(a,t.atr,sd,t.pUp,true);
        const spreadKnown = t.contract && t.contract.side===sd && t.contract.spreadPct!=null;
        if(x.L.breakout && x.L.flow && !x.L.jev && (!spreadKnown || t.contract.spreadPct<=RULES.SPREAD_MAX)){ const entry=a.price;

          <button className="ghost" onClick=${()=>{ tpTone(); if(sound==='voice') sayLine('N V D A, five minute play, target hit'); }}>Test target</button>
          <button className="ghost" onClick=${()=>{ stopTone(); if(sound==='voice') sayLine('T S L A, GO IN, stopped out'); }}>Test stop</button>
          <button className="ghost" onClick=${()=>{ fadeTone(); if(sound==='voice') sayFade('AMD'); }}>Test fade</button>`}
      </div></details>`}
      <span className="sep"></span>
      <label>Cards</label>
      <span className="seg" role="group" aria-label="Card detail">${[['simple','Simple'],['full','Full detail']].map(([k,l])=>html`<button key=${k} className=${detail===k?'on':''} aria-pressed=${detail===k} onClick=${()=>setDetail(k)}>${l}</button>`)}</span>
    </div>

    <${TodayPlays} T=${T} budget=${budget} mode=${mode}/>

    <div className="cards">${cardOrder(T).map(s=>T[s]? html`<${Card} key=${s} t=${T[s]} budget=${budget} mode=${mode} detail=${detail} flash=${(flashUntil.current[s]||0)>now}/>` : html`<article key=${s} className="card"><span className="sym">${s}</span><span className="note">${mode==='live'?'Waiting for the first refresh.':(mode==='replay'?'Pick a day and press Load day.':'Loading the simulated session.')}</span></article>`)}</div>

    ${mode==='live' && html`<${PnlSummary} rows=${paper} budget=${budget}/>`}

    ${mode!=='live' && sim.current && html`<${Scorecard} T=${T} budget=${budget} realOpt=${realOpt} mode=${mode} done=${dayDone}/>`}

    <${PaperLog} db=${db} rows=${paper} dbState=${dbState} budget=${budget}/>
    <${RealLog} rows=${real} paper=${paper} onSync=${syncWebull} syncMsg=${syncMsg} canSync=${!!mcp && !!db}/>

    <div className="stack">
      <section className="panel">
        <div className="row"><h2>Live rules</h2><span className="note">tuned on 12 months of 1-minute data</span></div>
        <div className="rules">
          <div className="rule"><div className="k"><span>Trigger window</span><b>8:45–9:00 CT</b></div><div className="v">Prime window. GO IN keeps firing to 2:00 PM on all 11 tickers, first signal per ticker per day.</div></div>
          <div className="rule"><div className="k"><span>Breakout</span><b>${W.breakout} pts</b></div><div className="v">Price beyond the 8:30–8:45 range by 0.2 × ATR</div></div>
          <div className="rule"><div className="k"><span>Volume delta *</span><b>${W.flow} pts</b></div><div className="v">Net buying or selling ≥ 10% of session volume so far</div></div>
          <div className="rule"><div className="k"><span>Jev news *</span><b>${W.jev} pts</b></div><div className="v">Jev probability ≥ 65% in the trade direction</div></div>
          <div className="rule"><div className="k"><span>Spread</span><b>${W.spread} pts</b></div><div className="v">30-day contract spread ≤ 5% of mid</div></div>
          <div className="rule"><div className="k"><span>GO IN</span><b>≥ 75</b></div><div className="v">* Volume and Jev must both agree with the direction</div></div>
          <div className="rule"><div className="k"><span>5-MIN GO</span><b>5-min close</b></div><div className="v">A 5-minute candle (8:45–8:49, 8:50–8:54 …) closes beyond the trigger with volume delta past ±10%. Own entry at that close; Jev recorded, not required.</div></div>
          <div className="rule"><div className="k"><span>TECH GO</span><b>math only</b></div><div className="v">Breakout + volume passed on the 1-minute bar but Jev was under 65%. Tracked for comparison.</div></div>
          <div className="rule"><div className="k"><span>Stop / target</span><b>−0.5 / +1.5 ATR</b></div><div className="v">Price lines set at entry. No score-based exit.</div></div>
          <div className="rule"><div className="k"><span>Contract · exit</span><b>ATM · 30 days</b></div><div className="v">Strike nearest price, expiry nearest 30 days. Flat 2:40 PM CT if neither line hits.</div></div>
        </div>
      </section>
      <section className="panel">
        <div className="row"><h2>Backtest baseline</h2><span className="note">All 11 tickers · Oct 2025 – Oct 2026</span></div>
        <div className="tabs" role="tablist">${[['win','8:45–9:00 window'],['day','All day 8:45–2:00']].map(([k,l])=>html`<button key=${k} role="tab" aria-selected=${btView===k} className=${btView===k?'on':''} onClick=${()=>setBtView(k)}>${l}</button>`)}</div>
        <div className="tbl"><table>
          <thead><tr><th>Ticker</th><th>Trades/yr</th><th>Win</th><th>Option/trade</th><th>Profit factor</th><th>Oct–Apr</th><th>Apr–Oct</th></tr></thead>
          <tbody>${[...PRIMARY, ...REF, 'NVDA+TSLA', 'All 11'].map(k=>{ const r=BT11[btView][k]; const tot=k.includes('+')||k.startsWith('All');
            return html`<tr key=${k} style=${tot?{borderTop:'1px solid var(--line-2)',fontWeight:600}:{}}><td style=${{fontFamily:'var(--f-body)',textAlign:'left'}}>${k}${PRIMARY.includes(k)?' ·  traded':''}</td><td>${r[0]}</td><td>${r[1].toFixed(0)}%</td><td className=${r[2]>=0?'up':'dn'}>${pct(r[2])}</td><td className=${r[3]>=1.2?'up':(r[3]<1?'dn':'')}>${r[3].toFixed(2)}</td><td>${pct(r[4])}</td><td>${pct(r[5])}</td></tr>`; })}</tbody>
        </table></div>
        <div className="note">Breakout + volume delta, 0.5 ATR stop, 1.5 ATR target, flat 2:40, option costs from ~30-day ATM quotes (for 7 tickers, today's quotes stand in for the whole year). Jev has no history, so it is not in these numbers. All day = first signal per ticker from 8:45 to 2:00. Only NVDA, TSLA, MU and PLTR were positive in the window; all day, only MU stayed clearly positive. The paper log is the real test.</div>
        <div className="note num">5-minute candle-close entry, same exits: NVDA + TSLA 8:45–9:00 · 30 trades/yr · 57% wins · +7.1%/trade · PF 2.03 (1-min: 44 · 52% · +3.0% · 1.37). NVDA + TSLA all day · PF 1.18 (1-min 1.00). All 11 window · PF 0.92 (1-min 0.84). All 11 all day · PF 0.69 (same).</div>
      </section>
    </div>


    <footer>Live mode reads 1-minute bars, news and the option chain from Massive and scores the headlines with Jev, through the servers on your Mac. It only works in the Claude desktop app there. Volume delta is estimated from 1-minute bars (close position within each bar's range). Option values in the projections use the contract's delta, gamma and theta. They are estimates, not quotes. Research and paper trading only.</footer>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>

</body></html>
