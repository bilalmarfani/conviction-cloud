<style>
/* Layout: header with data-health light; four account tiles (one per $50K paper account); tab bar; each tab = account strip, open positions, live signals, closed trades, backtest. Terminal look carried over from v2, dark-first with a light variant. */

  --bg:#0a0e13; --panel:#11171f; --panel-2:#161e28; --line:#223040; --line-2:#2c3b4d;
  --fg:#d9e2ec; --muted:#8193a6; --dim:#5a6a7e; --accent:#5fb4ff; --accent-ink:#04121f;
  --go:#2bea7c; --go-ink:#03140a; --go-soft:rgba(43,234,124,.13);
  --warn:#ff5a5f; --warn-soft:rgba(255,90,95,.13);
  --amber:#ffc24b; --amber-soft:rgba(255,194,75,.12);
  --gold:#e8c15a; --pink:#ff6fb5;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f5f8; --panel:#ffffff; --panel-2:#eef2f6; --line:#d6dde6; --line-2:#c3cdd9;
  --fg:#111a24; --muted:#56667a; --dim:#7c8a9c; --accent:#1769c2; --accent-ink:#ffffff;
  --go:#0f8f4a; --go-ink:#ffffff; --go-soft:rgba(15,143,74,.10);
  --warn:#c9302c; --warn-soft:rgba(201,48,44,.09);
  --amber:#a86a00; --amber-soft:rgba(168,106,0,.10); --gold:#8a6a00; --pink:#b8306f; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#f3f5f8; --panel:#ffffff; --panel-2:#eef2f6; --line:#d6dde6; --line-2:#c3cdd9;
  --fg:#111a24; --muted:#56667a; --dim:#7c8a9c; --accent:#1769c2; --accent-ink:#ffffff;
  --go:#0f8f4a; --go-ink:#ffffff; --go-soft:rgba(15,143,74,.10);
  --warn:#c9302c; --warn-soft:rgba(201,48,44,.09);
  --amber:#a86a00; --amber-soft:rgba(168,106,0,.10); --gold:#8a6a00; --pink:#b8306f; color-scheme:light; }

body{font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 60px;display:grid;gap:14px}

h3{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;margin:0;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.sub{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:12px}

.chip.ok{color:var(--go);border-color:var(--go)} .chip.bad{color:var(--warn);border-color:var(--warn)} .chip.mid{color:var(--amber);border-color:var(--amber)}

  --grid:rgba(23,105,194,.05); --halo:rgba(23,105,194,.08); --halo2:rgba(15,143,74,.05); } }
:root[data-theme="light"]{ --panel-hi:#ffffff; --edge:rgba(255,255,255,.9); --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 16px 34px -22px rgba(17,26,36,.35), 0 2px 6px -3px rgba(17,26,36,.18);
  --grid:rgba(23,105,194,.05); --halo:rgba(23,105,194,.08); --halo2:rgba(15,143,74,.05); }
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1100px 520px at 12% -8%, var(--halo), transparent 60%), radial-gradient(900px 480px at 100% 0%, var(--halo2), transparent 55%),

.acct:hover{box-shadow:0 1px 0 var(--edge) inset, 0 26px 50px -24px rgba(0,0,0,.9), 0 0 0 1px var(--line-2)}

.tabs button.on{box-shadow:0 2px 14px -4px var(--accent)}

.dot.bad{box-shadow:0 0 0 3px var(--panel-2), 0 0 10px var(--warn)}

<script>
/* ============ Conviction Board v3 — engine (pure functions, shared by live + backtest) ============ */
const E = (function(){
const OPEN = 510, CLOSE = 900, FLAT = 880;          // CT minutes: 8:30, 15:00, 14:40
const ACCOUNT = 50000;
const DEFAULTS = {
  riskPct: 0.01,            // $500 per trade
  maxPremium: 2500,         // options: max premium per trade
  maxOpenIntraday: 3,
  maxOpenSwing: 6,
  maxSwingNotional: 10000,
  maxIntradayNotional: 25000,
  dailyStop: 1000,          // tab halts for the day
  weeklyStop: 2500,         // tab halts for the week
  streakHalf: 3,            // half size after N losses in a row
  requireJev: false,
  jevMin: 0.65
};
const COMMOD = ['GLD','SLV','USO','UNG','CPER','GDX','GDXJ','DBA','URA','TLT','XLE','XOM','CVX','OXY','SLB','COP','FCX','NEM'];
const UNIVERSE = ('AAPL MSFT NVDA AMZN GOOGL META TSLA AVGO AMD MU INTC QCOM ARM SMCI MRVL LRCX AMAT KLAC ANET DELL ORCL CRM ADBE NOW PLTR CRWD PANW SNOW NET DDOG ' +
  'SHOP UBER ABNB NFLX DIS COIN HOOD MSTR SOFI PYPL XYZ RBLX APP AFRM RDDT TTWO EA JPM GS BAC MS C WFC V MA AXP UNH LLY ABBV MRK PFE JNJ COST WMT TGT HD LOW NKE ' +
  'SBUX MCD KO PEP CAT DE GE BA LMT RTX XOM CVX OXY SLB COP FCX NEM SPY QQQ IWM DIA SMH XLF XLE XLK GLD SLV USO UNG CPER GDX GDXJ DBA URA TLT').split(' ');

/* ---------- time ---------- */
const ctFmt = new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short'});
function ct(ms){ const p={}; for(const x of ctFmt.formatToParts(new Date(ms))) p[x.type]=x.value; const h=(+p.hour)%24; return {date:`${p.year}-${p.month}-${p.day}`, min:h*60+(+p.minute), wd:p.weekday}; }
function shiftDays(d,n){ const x=new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function dte(a,b){ return Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5); }
function hm(min){ if(min==null) return '–'; const h=Math.floor(min/60), m=min%60; return `${((h+11)%12)+1}:${String(m).padStart(2,'0')}${h<12?'a':'p'}`; }
function weekKey(d){ const x=new Date(d+'T12:00:00Z'); const day=(x.getUTCDay()+6)%7; x.setUTCDate(x.getUTCDate()-day); return x.toISOString().slice(0,10); }

/* ---------- Massive CSV parsing ---------- */
function resultText(res){
  if(res==null) return '';
  if(typeof res==='string') return res;
  let p = res.payload!==undefined ? res.payload : null;
  if(p && typeof p==='object' && typeof p.result==='string') return p.result;
  if(typeof p==='string'){ try{ const j=JSON.parse(p); if(j && typeof j.result==='string') return j.result; }catch(e){} return p; }
  const t = res.content && res.content.find(c=>c.type==='text');
  if(t){ try{ const j=JSON.parse(t.text); if(j && typeof j.result==='string') return j.result; }catch(e){} return t.text; }
  return '';
}
function splitRow(line){ const out=[]; let cur='', q=false, depth=0;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; continue; }
    if(ch==='"'){q=true;continue;} if(ch==='['||ch==='{')depth++; if(ch===']'||ch==='}')depth--;
    if(ch===','&&depth===0){out.push(cur);cur='';} else cur+=ch; }
  out.push(cur); return out; }
function parseCSV(text){
  const lines=(text||'').split('\n'); const rows=[]; if(!lines.length) return rows;
  const head=splitRow(lines[0]); if(head.length<2) return rows;
  for(let i=1;i<lines.length;i++){ const ln=lines[i]; if(!ln.trim()) break; const c=splitRow(ln); const o={}; head.forEach((h,j)=>o[h]=c[j]); rows.push(o); }
  return rows;
}
// "Next page available. To fetch, call call_api with path="..." and params={"cursor": "..."}"
function nextPage(text){
  const m = /Next page available[\s\S]*?path="([^"]+)"[\s\S]*?params=(\{[^}]*\})/.exec(text||''); if(!m) return null;
  let params={}; try{ params=JSON.parse(m[2]); }catch(e){ const c=/"cursor":\s*"([^"]+)"/.exec(m[2]); if(c) params={cursor:c[1]}; }
  return {path:m[1], params};
}
function toBars(rows){ return rows.map(r=>({t:+r.t,o:+r.o,h:+r.h,l:+r.l,c:+r.c,v:+r.v})).filter(b=>b.t>0 && Number.isFinite(b.c) && Number.isFinite(b.h)); }

/* ---------- bars ---------- */
// group 1-min bars by CT date, RTH only, with .min
function byDay(bars){ const days={}; for(const b of bars){ const p=ct(b.t); if(p.min<OPEN||p.min>=CLOSE) continue; (days[p.date]=days[p.date]||[]).push({...b, min:p.min}); }
  for(const k in days) days[k].sort((a,b)=>a.t-b.t); return days; }
function rth(bars){ return bars.map(b=>({...b, min: b.min!=null?b.min:ct(b.t).min})).filter(b=>b.min>=OPEN && b.min<CLOSE); }
// n-minute bars aligned to 8:30 from 1-min RTH bars; .done when the bucket's last minute is present (or a later bar exists)
function agg(bars, n){ const out=[]; let cur=null;
  for(const b of bars){ const k=Math.floor((b.min-OPEN)/n); const start=OPEN+k*n;
    if(!cur || cur.start!==start){ if(cur) { cur.done=true; out.push(cur); } cur={start,end:start+n-1,min:start,o:b.o,h:b.h,l:b.l,c:b.c,v:b.v,last:b.min,t:b.t}; }
    else { cur.h=Math.max(cur.h,b.h); cur.l=Math.min(cur.l,b.l); cur.c=b.c; cur.v+=b.v; cur.last=b.min; }
  }
  if(cur){ cur.done = cur.last>=cur.end; out.push(cur); }
  return out; }
function emaArr(vals, n){ const k=2/(n+1); const out=[]; let e=null; for(const v of vals){ e = e==null? v : v*k + e*(1-k); out.push(e); } return out; }
function vwapArr(bars){ let pv=0, vv=0; return bars.map(b=>{ pv+=b.v*(b.h+b.l+b.c)/3; vv+=b.v; return vv>0?pv/vv:b.c; }); }
function sma(a,i,n){ if(i+1<n) return null; let s=0; for(let k=i-n+1;k<=i;k++) s+=a[k]; return s/n; }

/* ---------- daily context ---------- */
// daily: sorted daily bars (t,o,h,l,c,v) up to and including the last COMPLETED day before `date`
function dailyCtx(daily){
  const n=daily.length; if(n<2) return null;
  const c=daily.map(d=>d.c), tr=[];
  for(let i=1;i<n;i++) tr.push(Math.max(daily[i].h,daily[i-1].c)-Math.min(daily[i].l,daily[i-1].c));
  const atr = tr.slice(-14).reduce((s,x)=>s+x,0)/Math.max(1,Math.min(14,tr.length));
  const last=daily[n-1];
  const vols=daily.slice(Math.max(0,n-21),n-1).map(d=>d.v);

/* ---------- intraday strategies ----------

const STRATS = {
  m1: { key:'m1', tf:1, name:'1-min Momentum', short:'1m', instr:'option',
    blurb:'Opening-range break with volume delta (v2 logic). Break of the 8:30–8:44 range by 0.2 ATR with net volume delta ≥ 10% of session volume. Entries 8:45–10:30.',
    rules:['Range 8:30–8:44, trigger = range high/low ± 0.2 ATR','Volume delta ≥ +10% (calls) or ≤ −10% (puts) of session volume','Entries 8:45–10:30 CT, one per ticker per day','Stop 0.5 ATR · T1 1.0 ATR (sell half, stop to breakeven) · T2 1.5 ATR · flat 2:40'],
    detect(b1, ctx, st){

  m15:{ key:'m15', tf:15, name:'15-min Trend', short:'15m', instr:'option',
    blurb:'Higher-low continuation with the daily trend: only longs above the 20-day average (puts below), entered when a 15-min pullback bar is taken out while holding above VWAP.',

function pullback(b1, ctx, st, n, o){

  let pi=-1; for(let k=i-1;k>=Math.max(0,i-4);k--){ const x=bars[k]; if(side>0? x.c<x.o : x.c>x.o){ pi=k; break; } }

/* ---------- trade management (shared) ----------

/* ---------- swing (daily) ---------- */
// daily rows sorted asc. Returns indicator arrays used by the scan and the backtest
function swingInd(d){

  }

// crowd lean from Liquid (share of Liquid traders long), written by Claude's morning task. Board tickers: GLD=GOLD, SLV=SILVER, USO=WTI oil, SPY=S&P 500
let CROWD = {map:{}, asOf:null};
const CBADGE = sym=>{ const c=CROWD.map[sym]; if(!c || c.longPct==null) return null; const lp=c.longPct;
  const k = lp<=35? 'win' : lp>=65? 'loss' : ''; const lean = lp<=35? 'crowd short' : lp>=65? 'crowd long' : 'crowd balanced';
  return html` <span className=${'pill '+k} title=${`Liquid traders: ${lp}% long (${lean})${c.smartLongPct!=null?` · profitable traders ${c.smartLongPct}% long`:''} · as of ${CROWD.asOf||'?'}`}>${lp}% L</span>`; };
const EARN_DAYS = 14;
const wdOf = d => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d+'T12:00:00Z').getUTCDay()];
function prevSession(d){ let x=E.shiftDays(d,-1); while(wdOf(x)==='Sat'||wdOf(x)==='Sun') x=E.shiftDays(x,-1); return x; }
// next report on or after today: {date, when:'amc'|'bmo'|'unk', days, lastDay (last session to hold through, exit at 2:55 PM)}
function earnOf(sym, today){ const e=EARN.map[sym]; if(!e || !e.date) return null; const days=E.dte(today, e.date); if(days<0) return null;
  return {...e, days, lastDay: e.when==='amc'? e.date : prevSession(e.date)}; }
function earnBlock(sym, today){ const e=earnOf(sym, today); return e && e.days<=EARN_DAYS ? e : null; }
function earnTxt(e){ return dshort(e.date)+(e.when==='amc'?' after close':(e.when==='bmo'?' before open':' (time not set)'))+' · '+(e.days===0?'today':(e.days===1?'tomorrow':'in '+e.days+' days')); }
function earnStale(today){ return !EARN.asOf || E.dte(EARN.asOf, today)>7; }
const EBADGE = (sym, maxDays=30)=>{ const e=earnOf(sym, E.ct(Date.now()).date); if(!e || e.days>maxDays) return null;
  return html` <span className=${'pill '+(e.days<=EARN_DAYS?'loss':'')} title=${'Earnings '+earnTxt(e)}>ER ${e.days===0?'today':dshort(e.date)}</span>`; };
const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };

const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ---------- Request budget: the Claude app caps how many local tool calls a page makes per minute (shared by every open board).
   One governor paces every call: priority 0 = trade management, 1 = live data, 2 = scans, 3 = backtests.
   On "rate_limited" it pauses, cuts the pace by 40%, and creeps back up after 2 quiet minutes. ---------- */
/* On the cloud server there is no Claude-app cap: data comes from the server's live stream (or Massive directly), so the governor runs far higher. */
const CLOUD = !!(window.__CC && window.__CC.board);
const STREAMING = ()=> CLOUD && window.__CC.live !== false;   // the server reports whether its live stream is on
const PACE = ()=> STREAMING()? 2000 : 5000;                     // cloud refresh pace: 2 s on the stream, 5 s on regular requests
const GOV={rate:CLOUD?1200:36, max:CLOUD?1200:90, min:6, tokens:2, last:Date.now(), pausedUntil:0, okSince:Date.now(), queue:[], timer:null, limited:0, lastLimitAt:0};
function govRefill(){ const n=Date.now(); GOV.tokens=Math.min(Math.max(1,GOV.rate/20), GOV.tokens+(n-GOV.last)/60000*GOV.rate); GOV.last=n; }
function govSched(ms){ if(GOV.timer) return; GOV.timer=setTimeout(()=>{ GOV.timer=null; govPump(); }, Math.max(30,ms)); }
function govPump(){ govRefill(); const n=Date.now(); if(n<GOV.pausedUntil){ govSched(GOV.pausedUntil-n); return; }
  GOV.queue.sort((x,y)=>x.pr-y.pr || x.t-y.t); while(GOV.queue.length && GOV.tokens>=1){ GOV.tokens-=1; GOV.queue.shift().go(); }
  if(GOV.queue.length) govSched((1-GOV.tokens)/GOV.rate*60000); }
function govTake(pr){ return new Promise(r=>{ GOV.queue.push({pr, t:Date.now(), go:r}); govPump(); }); }
function govLimited(ms){ const n=Date.now(); if(n-GOV.lastLimitAt>5000) GOV.rate=Math.max(GOV.min, Math.round(GOV.rate*0.6)); GOV.lastLimitAt=n; GOV.limited++; GOV.tokens=0; GOV.okSince=n; GOV.pausedUntil=Math.max(GOV.pausedUntil, n+Math.max(ms||0, 15000)); }
function govOk(){ const n=Date.now(); if(n-GOV.okSince>120000 && GOV.rate<GOV.max){ GOV.rate=Math.min(GOV.max, GOV.rate+4); GOV.okSince=n; } }
const LANES={live:{active:0,max:CLOUD?8:2,wait:[]}, bulk:{active:0,max:CLOUD?2:1,wait:[]}};
const PRI={mgmt:0, live:1, bulk:2, bt:3};
const ERRLOG=[]; const STATS={ok:0, fail:0, retried:0};
async function slot(lane, fn){ const Lq=LANES[lane]||LANES.live; if(Lq.active>=Lq.max) await new Promise(r=>Lq.wait.push(r)); Lq.active++; try{ return await fn(); } finally{ Lq.active--; const w=Lq.wait.shift(); if(w) w(); } }
const HARD=['no_mcp','not_granted','not_in_manifest','server_not_connected','capability_disabled','capability_removed','blocked_by_policy','bad_request','cancelled','approval_required','user_changed'];
async function hostCall(mcp, server, tool, input, lane='live'){
  if(!mcp) throw {code:'no_mcp', message:'No connection in this view'};
  const pr=PRI[lane]??1, sl=(lane==='bulk'||lane==='bt')?'bulk':'live'; let tries=0, rl=0;
  for(;;){
    await govTake(pr);
    try{ const r=await slot(sl, ()=>mcp.callTool(server, tool, input, {cache:false})); STATS.ok++; govOk(); return r; }
    catch(e){ const code=(e&&e.code)||'error'; const msg=String((e&&e.message)||'').slice(0,220);
      ERRLOG.unshift({at:Date.now(), code, msg, path:(input&&input.path? input.path.split('/').slice(0,6).join('/') : server+' '+tool), lane, attempt:tries+rl+1}); if(ERRLOG.length>40) ERRLOG.length=40;
      if(code==='rate_limited'){ govLimited(e&&e.retryAfterMs); rl++; if(rl>12){ STATS.fail++; throw e; } STATS.retried++; continue; }
      tries++; if(HARD.includes(code) || tries>=4){ STATS.fail++; throw e; }
      STATS.retried++; await sleep(Math.min(8000, (e&&e.retryAfterMs) || (700*Math.pow(2,tries-1)+Math.random()*500))); } }
}
async function massive(mcp, path, params, lane='live'){ const r=await hostCall(mcp,'host:massive','call_api', params?{path,params}:{path}, lane); return E.resultText(r); }

let AC=null;
function audioOn(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return true; }catch(e){ return false; } }
function tone(notes, type='triangle', gain=0.35){ if(!AC) return; const t0=AC.currentTime+0.02; const out=AC.createGain(); out.gain.value=0.5; out.connect(AC.destination);
  notes.forEach(([dt,f,len])=>{ const o=AC.createOscillator(); o.type=type; o.frequency.value=f; const g=AC.createGain(); const st=t0+dt;
    g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(gain,st+0.01); g.gain.exponentialRampToValueAtTime(0.0001,st+(len||0.35)); o.connect(g); g.connect(out); o.start(st); o.stop(st+(len||0.35)+0.05); }); }
const S_GO = ()=>tone([[0,1318.5,0.5],[0.12,1760,0.7]],'sine',0.3);

/* ---------- small components ---------- */
function Curve({pts, h=110}){
  if(!pts || pts.length<2) return html`<div className="empty">The equity curve appears after the first closed trade.</div>`;
  const W=600, ys=pts.map(p=>p.eq), lo=Math.min(...ys), hi=Math.max(...ys), pad=(hi-lo)*0.1||50;
  const sx=i=>4+i*(W-8)/(pts.length-1), sy=v=>h-6-((v-lo+pad)/((hi-lo)+2*pad))*(h-12);
  const base=sy(pts[0].eq); const last=pts[pts.length-1].eq; const col = last>=pts[0].eq ? 'var(--go)' : 'var(--warn)';
  const d=pts.map((p,i)=>(i?'L':'M')+sx(i).toFixed(1)+','+sy(p.eq).toFixed(1)).join(' ');
  const gid='g'+Math.abs(Math.round(last*7+pts.length*13))%100000;
  return html`<svg className="curve" viewBox=${'0 0 '+W+' '+h} preserveAspectRatio="none" role="img" aria-label="Account equity after each closed trade">
    <defs><linearGradient id=${gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor=${col} stopOpacity="0.32"/><stop offset="1" stopColor=${col} stopOpacity="0"/></linearGradient></defs>
    <line x1="0" x2=${W} y1=${base} y2=${base} stroke="var(--line-2)" strokeDasharray="4 4" vectorEffect="non-scaling-stroke"/>
    <path d=${d+' L'+sx(pts.length-1)+','+h+' L'+sx(0)+','+h+' Z'} fill=${'url(#'+gid+')'}/>
    <path d=${d} fill="none" stroke=${col} strokeWidth="2" vectorEffect="non-scaling-stroke"/>
    <circle cx=${sx(pts.length-1)} cy=${sy(last)} r="4" fill=${col}/>
  </svg>`;
}
function Stat({k,v,c}){ return html`<div className="stat"><div className="k">${k}</div><div className=${'v '+(c||'')}>${v}</div></div>`; }

  const runScan = useCallback(async (force)=>{
    const Lc=L.current; if(Lc.scanRun) return; const t=now(); const ph=phase();
    const after = ph==='closed' && t.min>=E.CLOSE;     // after the close: today's bar is complete -> scan for the next session
    let forDate=t.date; if(after || ph==='weekend'){ forDate=E.shiftDays(t.date,1); while(['Sat','Sun'].includes(E.ct(Date.parse(forDate+'T17:00:00Z')).wd)) forDate=E.shiftDays(forDate,1); }
    const prev=scans[forDate]; if(!force && prev && prev.td && prev.scanned>=E.UNIVERSE.length*0.9) return;   // redo missing, old-format or incomplete scans
    Lc.scanRun={done:0, total:E.UNIVERSE.length, forDate}; setTick(x=>x+1);
    const series={}; const queue=[...E.UNIVERSE];
    await Promise.all([0,1,2].map(async()=>{ while(queue.length){ const sym=queue.shift();
      try{ const from=E.shiftDays(t.date,-800); let txt=null; for(let k=0;k<3 && txt==null;k++){ try{ txt=await api(`/v2/aggs/ticker/${sym}/range/1/day/${from}/${t.date}`, {adjusted:'true',sort:'asc',limit:5000}, 'bulk'); }catch(e){ if(k===2) throw e; await sleep(1500*(k+1)); } } const bars=E.toBars(E.parseCSV(txt));
        series[sym]=bars.filter(b=>E.ct(b.t+12*3600e3).date < forDate); }catch(e){}
      Lc.scanRun.done++; if(Lc.scanRun.done%5===0) setTick(x=>x+1); } }));
    const spy=series.SPY||[]; const ok=E.spyOkMap(spy); const cands=[];
    for(const sym in series){ const d=series[sym]; if(d.length<80) continue; const ind=E.swingInd(d); const i=d.length-1; const date=E.ct(d[i].t+12*3600e3).date;
      const sig=E.swingSignal(d, ind, i, sym, !!ok[date]); if(sig) cands.push({sym, setup:sig.setup, rvol:sig.rvol? +sig.rvol.toFixed(2):null, close:sig.close, sma20:+sig.sma20.toFixed(2), atr:+sig.atr.toFixed(3), low5:sig.low5, sigDate:date}); }
    cands.sort((a,b)=> a.setup===b.setup ? (b.rvol||0)-(a.rvol||0) : (a.setup==='breakout'?-1:1));
    const spyDate = spy.length? E.ct(spy[spy.length-1].t+12*3600e3).date : null;
    const td=[], tdNoRoom=[];
    for(const sym in series){ const d=series[sym]; if(d.length<120) continue; try{ const P=TD.prep(d); const i=d.length-1; const g=TD.signal(P,i); if(!g) continue;
      const pt=(ln)=> ln? {t1:d[ln.ia].t, p1:+ln.pa.toFixed(4), slope:+ln.slope.toFixed(6), touches:ln.touches} : null;
      if(g.rejected){ tdNoRoom.push({sym, side:g.side, setup:g.setup, why:g.rejected}); continue; }
      td.push({sym, side:g.side, setup:g.setup, entry:+g.entry.toFixed(4), stop:+g.stop.toFixed(4), risk:+g.risk.toFixed(4), t1:+g.t1.toFixed(4), t2:+g.t2.toFixed(4), next:g.next, atr:+g.atr.toFixed(4), trend:g.trend, action:pt(g.action), safety:pt(g.safety), sigDate:E.ct(d[i].t+12*3600e3).date}); }catch(e){} }
    td.sort((a,b)=> (a.setup===b.setup?0:(a.setup==='bounce'?-1:1)) || ((b.action?b.action.touches:0)-(a.action?a.action.touches:0)));
    await put('v3scan', forDate, {forDate, at:Date.now(), cands, td, tdNoRoom:tdNoRoom.slice(0,25), scanned:Object.keys(series).length, spyOk: spyDate? !!ok[spyDate] : null});
    Lc.scanRun=null; setTick(x=>x+1);
  },[api, put, scans]);

  const swingEntries = useCallback(async ()=>{
    const t=now(); if(phase()!=='open' || t.min<E.OPEN+1) return; const sc=scans[t.date]; if(!sc) return;
    if(t.min>600){ return; }  // after 10:00 the open-gap fill is stale: wait for tomorrow's list
    const tried=(L.current.swTried=L.current.swTried||{}); const day=(tried[t.date]=tried[t.date]||new Set());
    for(const cnd of sc.cands||[]){
      const open=tradesRef.current.filter(x=>x.tab==='sw'&&x.status==='open').length; if(open>=cfgRef.current.maxOpenSwing) break;
      if(day.has(cnd.sym)) continue; const s=L.current.snap[cnd.sym]; if(!s) continue; day.add(cnd.sym);
      if(earnBlock(cnd.sym,t.date)){ logSignal('sw',cnd.sym,{setup:cnd.setup, min:t.min, side:1},false,'Earnings '+earnTxt(earnBlock(cnd.sym,t.date))+': no new swing positions within '+EARN_DAYS+' days of a report'); continue; }
      const id=`${t.date}-sw-${cnd.sym}-1`; if(tradesRef.current.some(x=>x.id===id)) continue;
      const stop=E.swingStop(s.px, {low5:cnd.low5, atr:cnd.atr});
      await tryOpen('sw', cnd.sym, {side:1, entry:s.px, stop, t1:s.px+2*(s.px-stop), t2:s.px+4*(s.px-stop), setup:cnd.setup, min:t.min, sma20:cnd.sma20, rvol:cnd.rvol}, s.px);
    }
  },[scans, tryOpen]);

  const tdEntries = useCallback(async ()=>{
    const t=now(); if(phase()!=='open' || t.min<E.OPEN+15 || t.min>870) return; const sc=scans[t.date]; if(!sc || !(sc.td||[]).length) return;
    const notes=(L.current.tdNotes=L.current.tdNotes||{});
    for(const cnd of sc.td.slice(0,10)){
      const open=tradesRef.current.filter(x=>x.tab==='td'&&x.status==='open'); if(open.length>=(cfgRef.current.maxOpenTD||5)) break;
      if(open.some(x=>x.sym===cnd.sym) || tradesRef.current.some(x=>x.id===`${t.date}-td-${cnd.sym}-1`)) continue;
      const s=L.current.snap[cnd.sym]; if(!s) continue;
      { const eb=earnBlock(cnd.sym,t.date); if(eb){ notes[cnd.sym]={note:'Skipped: earnings '+earnTxt(eb), at:Date.now()}; continue; } }
      if(cnd.side>0? s.px<=cnd.stop : s.px>=cnd.stop){ notes[cnd.sym]={note:'Broke the stop level before confirming: setup cancelled for today', at:Date.now()}; continue; }
      if(Math.abs(s.px-cnd.entry)>cnd.atr){ notes[cnd.sym]={note:'Price ran more than 1 ATR from the setup: not chasing', at:Date.now()}; continue; }
      try{
        const b60=E.toBars(E.parseCSV(await api(`/v2/aggs/ticker/${cnd.sym}/range/1/hour/${E.shiftDays(t.date,-12)}/${t.date}`, {adjusted:'true',sort:'asc',limit:5000}))).filter(b=>{ const m=E.ct(b.t).min; return m>=480 && m<E.CLOSE; });
        const b15=E.rth(E.toBars(E.parseCSV(await api(`/v2/aggs/ticker/${cnd.sym}/range/15/minute/${E.shiftDays(t.date,-4)}/${t.date}`, {adjusted:'true',sort:'asc',limit:5000}))));
        const done15 = b15.filter(b=> !(E.ct(b.t).date===t.date && b.min+15>t.min));
        const cf=TD.confirm(b60, done15, cnd.side); notes[cnd.sym]={note:cf.note, at:Date.now(), ok:cf.ok};
        if(cf.ok){ const px=s.px, sd=cnd.side, risk=cnd.risk;
          await tryOpen('td', cnd.sym, {side:sd, entry:px, stop:px-sd*risk, t1:px+sd*2*risk, t2:cnd.t2+(px-cnd.entry), setup:'TD '+cnd.setup, tdSetup:cnd.setup, min:t.min, action:cnd.action, atr:cnd.atr, next:cnd.next, trend:cnd.trend}, px); }
      }catch(e){}
    }
  },[scans, api, tryOpen]);

  /* ---------- scheduler ---------- */
  useEffect(()=>{ if(!mcp) return; let stop=false;
    const run = async (name, fn)=>{ const B=L.current.busy; if(B[name]) return; B[name]=true; try{ await fn(); }catch(e){} finally{ B[name]=false; } };
    const id=setInterval(()=>{ if(stop) return; const Lc=L.current, n=Date.now(), ph=phase();
      const live = ph==='open'||ph==='pre';
      if(window.__VIEWER){ if(n>=Lc.next.snap){ Lc.next.snap=n+(live?(CLOUD?PACE():15000):300000); run('snap', doSnapshot); } setTick(x=>(x+1)%1e9); return; }  // cloud viewer: show prices, the always-on server copy trades
      if(n>=Lc.next.snap){ Lc.next.snap=n+(live?(CLOUD?PACE():15000):300000); run('snap', async()=>{ await doSnapshot(); await manageTick(); for(const s of Lc.inPlay) detectFor(s,true); }); }
      if(live && n>=Lc.next.bars){ Lc.next.bars=n+(CLOUD?PACE():6000); run('bars', doBars); }
      if(ph==='open' && n>=Lc.next.marks){ Lc.next.marks=n+(CLOUD?15000:60000); run('marks', doMarks); }
      if(n>=Lc.next.scan){ Lc.next.scan=n+10*60000; const t=now(); if(t.min>=360 || ph==='weekend') run('scan', ()=>runScan(false)); }
      if(ph==='open') run('swe', swingEntries);
      if(ph==='open' && n>=(Lc.next.td||0)){ Lc.next.td=n+180000; run('tde', tdEntries); }
      // data health alarm
      const H=Lc.health; const age=H.lastOk? (n-H.lastOk)/1000 : null;
      if(live && (age==null? H.fails>=3 : age>90) && n-H.alertAt>15*60000){ H.alertAt=n; toast('DATA STOPPED · no fresh Massive data for '+(age==null?'several tries':Math.round(age)+'s')+' ('+(H.lastErr||'no reply')+')','stop'); if(soundRef.current) S_ALARM();
        if(cfgRef.current.slackData) slack(`⚠️ Conviction Board v3: no fresh market data for ${age==null?'several attempts':Math.round(age)+' seconds'} (${H.lastErr||'no reply'}). Check that the Mac is awake and the Claude app is open.`); }
      setTick(x=>(x+1)%1e9);
    },1000);
    const vis=()=>{ if(document.visibilityState==='visible'){ L.current.next.snap=0; L.current.next.bars=0; wake(); } };
    document.addEventListener('visibilitychange',vis);
    return ()=>{ stop=true; clearInterval(id); document.removeEventListener('visibilitychange',vis); };
  },[mcp, doSnapshot, manageTick, doBars, doMarks, runScan, swingEntries, tdEntries, detectFor, catchUpOld, slack]);
  useEffect(()=>{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; let raf=0, el=null, ev=null;
    const apply=()=>{ raf=0; if(!el||!ev) return; const r=el.getBoundingClientRect(); const x=(ev.clientX-r.left)/r.width-0.5, y=(ev.clientY-r.top)/r.height-0.5;
      el.style.setProperty('--ry', (x*10).toFixed(2)+'deg'); el.style.setProperty('--rx', (-y*10).toFixed(2)+'deg'); };
    const move=e=>{ const t=e.target.closest && e.target.closest('.acct'); if(el && t!==el){ el.style.removeProperty('--rx'); el.style.removeProperty('--ry'); } el=t; ev=e; if(el && !raf) raf=requestAnimationFrame(apply); };
    const out=e=>{ if(el && !(e.relatedTarget && el.contains(e.relatedTarget))){ el.style.removeProperty('--rx'); el.style.removeProperty('--ry'); el=null; } };
    document.addEventListener('pointermove',move,{passive:true}); document.addEventListener('pointerout',out,{passive:true});
    return ()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerout',out); if(raf) cancelAnimationFrame(raf); };
  },[]);
  const wake = async ()=>{ try{ if(navigator.wakeLock && !L.current.wake) { L.current.wake=await navigator.wakeLock.request('screen'); L.current.wake.addEventListener('release',()=>{ L.current.wake=null; }); } }catch(e){} };
  useEffect(()=>{ wake(); },[]);
  useEffect(()=>{ if(window.__VIEWER) return; if(mcp && trades.length && !L.current.caught){ L.current.caught=true; setTimeout(()=>catchUpOld(), 3000); } },[mcp, trades, catchUpOld]);
  // re-sync runtimes when trades docs arrive after a reload
  useEffect(()=>{ const t=now(); for(const tr of trades) if(tr.status==='open' && INTRA(tr.tab) && tr.date===t.date){ const b=L.current.b1[tr.sym]; if(b && !(L.current.rt[tr.id]||{}).synced) syncTrade(tr, b.bars); } },[trades, syncTrade]);

  /* ---------- derived ---------- */
  const T=now(); const ph=phase(); const H=L.current.health; const age=H.lastOk? Math.round((Date.now()-H.lastOk)/1000) : null;
  const healthState = !mcp ? 'bad' : (age==null ? (H.fails? 'bad':'mid') : (age<=35?'ok':(age<=90?'mid':'bad')));
  const enrich = tr => tr.status==='open' ? {...tr, unreal:unrealOf(tr)} : tr;
  const acct = {}; for(const k of TABS){ const list=trades.filter(x=>x.tab===k).map(enrich); acct[k]={list, st:E.stats(list), g:E.guard(list, T.date, cfg)}; }

  return html`<div className="wrap">
    <div className="toasts" aria-live="polite">${toasts.map(x=>html`<div key=${x.id} className=${'toast '+x.kind}>${x.text}</div>`)}</div>
    <div className="top">
      <div style=${{display:'grid',gap:'6px'}}>
        <h1>Conviction Board v3</h1>
        <div className="sub">Four $50,000 paper accounts, one per strategy. Internal paper trading only, no broker connected.</div>
      </div>
      <div className="row">
        <span className="chip num">${new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',weekday:'short',hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date())} CT</span>
        <span className=${'chip '+(ph==='open'?'ok':(ph==='pre'?'mid':''))}>${{open:'Market open',pre:'Premarket',closed:'Market closed',weekend:'Weekend'}[ph]}</span>
        <span className="chip health" title=${H.lastErr? 'Last error: '+H.lastErr : ''}><span className=${'dot '+healthState}></span>${!mcp? 'No data link' : age==null? 'Connecting' : 'Data '+age+'s ago'}</span>
        <button className=${'sm '+(sound?'primary':'')} onClick=${()=>{ const ok=audioOn(); setSound(s=>!s && ok); if(ok && !sound) S_GO(); }}>${sound?'Sound on':'Turn sound on'}</button>
      </div>
    </div>
    ${capState==='none' || capState==='nomcp' ? html`<div className="banner">Live data needs this board open in the Claude desktop app on your Mac, where Massive and Jev are connected. Trades and backtests already saved still show here.</div>` : null}
    ${mcp && healthState==='bad' && ph!=='weekend' && ph!=='closed' ? html`<div className="banner">No fresh market data${age!=null?' for '+age+' seconds':''}${H.lastErr?' ('+H.lastErr+')':''}. Check that the Mac is awake and the Claude window is not minimized. Open trades will catch up from 1-minute bars when data returns.</div>` : null}
    <div className="accts">${TABS.map(k=>{ const a=acct[k]; const today=a.g.dayP;
      return html`<button key=${k} className=${'acct'+(tab===k?' on':'')} onClick=${()=>setTab(k)}>
        <div className="k"><span>${TABNAME[k]}</span><span>${a.st.open? a.st.open+' open':''}</span></div>
        <div className=${'v '+cls(a.st.equity-E.ACCOUNT)}>${'$'+Math.round(a.st.equity).toLocaleString('en-US')}</div>
        <div className="s">Today <span className=${cls(today)}>${money(today)}</span> · ${a.st.n} closed${a.st.win!=null?' · '+a.st.win.toFixed(0)+'% win':''}${a.g.halted?' · HALTED':''}</div>
      </button>`; })}</div>
    <div className="tabs" role="tablist">
      ${[['scan','Scanner'],['m1','1-min'],['m5','5-min'],['m15','15-min'],['sw','Swing'],['td','Top-Down'],['chart','Charts'],['set','Settings']].map(([k,l])=>html`<button key=${k} role="tab" aria-selected=${tab===k} className=${tab===k?'on':''} onClick=${()=>setTab(k)}>${l}${acct[k]&&acct[k].st.open?html`<span className="ct">${acct[k].st.open}</span>`:null}</button>`)}
    </div>
    ${tab==='scan' ? html`<${Scanner} L=${L.current} pins=${pins} setPins=${setPins} ph=${ph}/>` : null}
    ${E.STRATS[tab] ? html`<${StratTab} k=${tab} a=${acct[tab]} L=${L.current} cfg=${cfg} setCfg=${setCfg} signals=${signals.filter(s=>s.tab===tab)} bt=${bts[tab]} runBt=${(o)=>runBacktest(tab,o)} btState=${btState}/>` : null}
    ${tab==='sw' ? html`<${SwingTab} a=${acct.sw} L=${L.current} scans=${scans} runScan=${()=>runScan(true)} bt=${bts.sw} runBt=${(o)=>runBacktest('sw',o)} btState=${btState} signals=${signals.filter(s=>s.tab==='sw')}/>` : null}
    ${tab==='td' ? html`<${TDTab} a=${acct.td} L=${L.current} scans=${scans} runScan=${()=>runScan(true)} bt=${bts.td} runBt=${(o)=>runBacktest('td',o)} openChart=${(s)=>{ setChartSym(s); setTab('chart'); }}/>` : null}
    ${tab==='chart' ? html`<${ChartsTab} sym=${chartSym} setSym=${setChartSym} mcp=${mcp} L=${L.current} scans=${scans} trades=${trades}/>` : null}
    ${tab==='set' ? html`<${Settings} cfg=${cfg} setCfg=${setCfg} db=${db} trades=${trades} put=${put} slack=${slack} mcp=${mcp} health=${H}/>` : null}
    <footer className="note">Fills at the option mid (shares at last trade). The bid/ask column shows the same trades bought at the ask and sold at the bid. Data: Massive via ${window.__CC?'your Conviction server (trades are recorded by the copy that runs on the server around the clock)':'the Claude app on your Mac'} · news score: Jev. Research and paper trading only, not financial advice.</footer>
  </div>`;

  /* ---------- backtests (inside App for access to api) ---------- */
  function runBacktest(k, o){ return runBt(k,o); }
}

/* backtest runner shared state (outside render) */
let btState = {running:null, msg:'', pct:0};
let runBt = async ()=>{};

/* ---------- Scanner ---------- */
function Scanner({L, pins, setPins, ph}){
  const [q,setQ]=useState('');
  const all=Object.values(L.snap); const inPlay=new Set(L.inPlay);
  const rows = all.filter(s=>!q || s.sym.includes(q.toUpperCase())).sort((a,b)=> (inPlay.has(b.sym)-inPlay.has(a.sym)) || ((b.score||0)-(a.score||0)) || ((b.rvol||0)-(a.rvol||0)));
  const ctxSyms=['SPY','QQQ','IWM','GLD','SLV','USO']; const togglePin=s=>setPins(p=>p.includes(s)? p.filter(x=>x!==s) : [...p, s]);
  const [add,setAdd]=useState('');
  return html`<div style=${{display:'grid',gap:'14px'}}>
    <div className="stats">${ctxSyms.map(s=>{ const x=L.snap[s]; return html`<div key=${s} className="stat"><div className="k">${s}${E.COMMOD.includes(s)?' · commodity':''}${CROWD.map[s]&&CROWD.map[s].longPct!=null?' · crowd '+CROWD.map[s].longPct+'% long':''}</div><div className=${'v '+cls(x&&x.chg)}>${x? f2(x.px)+'  '+pct(x.chg,2) : '–'}</div></div>`; })}</div>
    <div className="panel">
      <div className="row between"><h2>In play now · ${L.inPlay.length}</h2>
        <div className="row"><input id="scan-filter" type="text" placeholder="Filter ticker" value=${q} onInput=${e=>setQ(e.target.value)} style=${{width:'130px'}}/>
          <input id="scan-pin" type="text" placeholder="Pin ticker" value=${add} onInput=${e=>setAdd(e.target.value.toUpperCase())} style=${{width:'110px'}}/>
          <button className="sm" onClick=${()=>{ const s=add.trim(); if(s && !pins.includes(s)) setPins([...pins,s]); setAdd(''); }}>Pin</button></div></div>
      <p className="note">One Massive snapshot every 15 seconds covers ${E.UNIVERSE.length} liquid stocks, ETFs and commodity ETFs. In play = your pins plus the top movers that pass: price ≥ $10, yesterday's dollar volume ≥ $100M, and volume pace ≥ 1.2× yesterday or a move ≥ 2%. Pace compares today's volume so far with yesterday's at the same share of the session, so it runs high in the first hour. These ${L.inPlay.length} names get 1-minute bars (refreshed about every 2 minutes, open trades first) and run through all three intraday strategies.</p>
      ${!all.length ? html`<div className="empty">${ph==='weekend'||ph==='closed' ? 'Market closed. The snapshot refreshes once a minute; movers fill in at the next session.' : 'Waiting for the first snapshot from Massive.'}</div>` :
      html`<div className="tbl"><table><thead><tr><th className="l">Ticker</th><th>Price</th><th>Change</th><th>Gap</th><th>Vol pace</th><th>Volume</th><th>Prev $vol</th><th>Score</th><th className="l">Status</th><th></th></tr></thead>
      <tbody>${rows.slice(0,60).map(s=>{ const pin=pins.includes(s.sym); const ip=inPlay.has(s.sym); const sg=['m1','m5','m15'].map(k=>L.sigs[k][s.sym]).find(x=>x&&x.sig);
        return html`<tr key=${s.sym} className=${(pin?'pin ':'')+(sg?'go':'')}><td className="sym l">${s.sym}${E.COMMOD.includes(s.sym)?html` <span className="pill cm">CMDTY</span>`:null}${EBADGE(s.sym,7)}${CBADGE(s.sym)}</td>
        <td>${f2(s.px)}</td><td className=${cls(s.chg)}>${pct(s.chg,2)}</td><td className=${cls(s.gap)}>${pct(s.gap,1)}</td><td className=${(s.rvol||0)>=1.5?'up':''}>${s.rvol? s.rvol.toFixed(2)+'×':'–'}</td>
        <td>${s.vol? (s.vol/1e6).toFixed(1)+'M':'–'}</td><td>${s.dollarPrev? '$'+(s.dollarPrev/1e9).toFixed(2)+'B':'–'}</td><td>${s.score!=null? s.score.toFixed(1):'–'}</td>
        <td className="l">${ip? html`<span className="pill open">IN PLAY</span>` : html`<span className="tag">watch</span>`}</td>
        <td><button className="sm ghost" onClick=${()=>togglePin(s.sym)} aria-label=${(pin?'Unpin ':'Pin ')+s.sym}>${pin?'Unpin':'Pin'}</button></td></tr>`; })}</tbody></table></div>`}
    </div></div>`;
}

/* ---------- strategy tab ---------- */
function AcctStats({a}){ const st=a.st, g=a.g;
  return html`<div style=${{display:'grid',gap:'8px'}}>
    ${g.halted? html`<div className="banner">${g.halted}</div>` : g.half? html`<div className="banner amber">${g.streak} losses in a row: trades are half size until the next win.</div>` : null}
    <div className="stats">
      <${Stat} k="Balance" v=${'$'+Math.round(st.equity).toLocaleString('en-US')} c=${cls(st.equity-E.ACCOUNT)}/>
      <${Stat} k="Today" v=${money(g.dayP)} c=${cls(g.dayP)}/>
      <${Stat} k="Win rate" v=${st.win!=null? st.win.toFixed(1)+'% ('+st.wins+'/'+st.n+')' : '–'}/>
      <${Stat} k="Profit factor" v=${st.pf==null?'–':(st.pf===Infinity?'∞':st.pf.toFixed(2))} c=${st.pf>=1.3?'up':(st.pf!=null&&st.pf<1?'dn':'')}/>
      <${Stat} k="Avg win / loss" v=${(st.avgW!=null?money(st.avgW):'–')+' / '+(st.avgL!=null?money(st.avgL):'–')}/>
      <${Stat} k="Max drawdown" v=${money(-st.maxDD,false)+' ('+st.maxDDPct.toFixed(1)+'%)'} c=${st.maxDD>0?'dn':''}/>
    </div>
    <div className="note">Realized ${money(st.realized)} at mid fills · ${money(st.spreadRealized)} if bought at the ask and sold at the bid · open P&L ${money(st.unreal)}</div>
  </div>`;
}
function OpenTable({list, L}){
  const open=list.filter(x=>x.status==='open'); if(!open.length) return html`<div className="empty">No open positions.</div>`;
  return html`<div className="tbl"><table><thead><tr><th className="l">Ticker</th><th className="l">Side</th><th className="l">Position</th><th>Entry</th><th>Now</th><th>Stop</th><th>T1 / T2</th><th>Mark</th><th>P&L</th><th className="l">Jev</th></tr></thead>
  <tbody>${open.map(t=>{ const s=L.snap[t.sym]; return html`<tr key=${t.id}><td className="sym l">${t.sym}</td>
    <td className="l"><span className=${'pill '+(t.side>0?'call':'put')}>${t.instr==='option'?(t.side>0?'CALL':'PUT'):(t.side>0?'LONG':'SHORT')}</span></td>
    <td className="l">${t.instr==='option'? html`${t.qty}× $${t.contract.strike} ${dshort(t.contract.expiry)}${t.partialQty?html` <span className="tag">(${t.partialQty} sold at T1)</span>`:null}` : html`${t.qty} sh${t.partialQty?html` <span className="tag">(${t.partialQty} sold)</span>`:null}`}<div className="tag">${t.setup} · ${tms(t.entryAt)}${(t.tab==='sw'||t.tab==='td')?' · day '+(t.swingDays||1):''}${(t.tab==='sw'||t.tab==='td')&&earnOf(t.sym,E.ct(Date.now()).date)&&earnOf(t.sym,E.ct(Date.now()).date).days<=EARN_DAYS?' · sells 2:55 PM '+dshort(earnOf(t.sym,E.ct(Date.now()).date).lastDay)+' before earnings':''}</div></td>
    <td>${f2(t.entryUnder)}<div className="tag">fill ${f2(t.entryFill)}</div></td><td>${s?f2(s.px):'–'}</td><td>${f2(t.stop)}</td><td>${f2(t.t1)} / ${f2(t.t2)}</td>
    <td>${t.instr==='option'? f2(t.mark) : (s?f2(s.px):'–')}</td><td className=${cls(t.unreal)}>${money(t.unreal)}</td>
    <td className="l">${t.jev? html`<span className=${t.jev.pDir>=0.65?'up':'tag'}>${t.jev.pDir.toFixed(2)}</span>` : html`<span className="tag">–</span>`}</td></tr>`; })}</tbody></table></div>`;
}
function ClosedTable({list}){
  const c=list.filter(x=>x.status==='closed').sort((a,b)=>(b.exitAt||0)-(a.exitAt||0)).slice(0,60);
  if(!c.length) return html`<div className="empty">No closed trades yet. Every GO IN lands here with its entry, exit and P&L.</div>`;
  return html`<div className="tbl"><table><thead><tr><th className="l">Date</th><th className="l">Ticker</th><th className="l">Setup</th><th>In → out</th><th>Fill in → out</th><th>Qty</th><th>P&L mid</th><th>P&L bid/ask</th><th>R</th><th>Weekly</th><th className="l">Exit</th><th className="l">Jev</th></tr></thead>
  <tbody>${c.map(t=>html`<tr key=${t.id}><td className="l">${dshort(t.date)}</td><td className="sym l">${t.sym} <span className=${'pill '+(t.side>0?'call':'put')}>${t.instr==='option'?(t.side>0?'C':'P'):(t.side>0?'L':'S')}</span></td>
    <td className="l">${t.setup}</td><td>${E.hm(t.entryMin)} → ${E.hm(t.exitMin)}</td><td>${f2(t.entryFill)} → ${f2(t.exitFill)}${t.partialQty?html`<div className="tag">half at ${f2(t.partialFill)}</div>`:null}</td><td>${t.qty}</td>
    <td className=${cls(t.pnl)}>${money(t.pnl)}</td><td className=${cls(t.pnlSpread)}>${money(t.pnlSpread)}</td><td className=${cls(t.R)}>${t.R!=null?t.R.toFixed(2):'–'}</td>
    <td className=${t.weekly&&t.weekly.pnl!=null?cls(t.weekly.pnl):''}>${t.weekly&&t.weekly.pnl!=null? money(t.weekly.pnl) : '–'}</td>
    <td className="l">${t.exitReason}</td><td className="l">${t.jev? t.jev.pDir.toFixed(2):'–'}</td></tr>`)}</tbody></table></div>`;
}
function WeeklyCompare({list}){
  const c=list.filter(x=>x.status==='closed' && x.weekly && x.weekly.pnl!=null); if(!c.length) return html`<div className="note">Weekly comparison: no finished trades with a weekly leg yet. Each options GO IN also paper-trades the nearest weekly (2+ days left) on the same signal; it does not count toward the account.</div>`;
  const sum=f=>c.reduce((a,x)=>a+(f(x)||0),0); const wins=f=>c.filter(x=>f(x)>0).length;
  return html`<div className="kv"><b>Same ${c.length} signals, ~3-week contract</b><span className="num">${money(sum(x=>x.pnl))} mid · ${money(sum(x=>x.pnlSpread))} bid/ask · ${(100*wins(x=>x.pnl)/c.length).toFixed(0)}% win</span>
    <b>Same signals, weekly contract</b><span className="num">${money(sum(x=>x.weekly.pnl))} mid · ${money(sum(x=>x.weekly.pnlSpread))} bid/ask · ${(100*wins(x=>x.weekly.pnl)/c.length).toFixed(0)}% win</span></div>`;
}
function JevSplit({list}){
  const c=list.filter(x=>x.status==='closed'); const w=c.filter(x=>x.jev && x.jev.pDir>=0.65), o=c.filter(x=>!(x.jev && x.jev.pDir>=0.65));
  const s=a=>{ const n=a.length; if(!n) return '–'; const wins=a.filter(x=>x.pnl>0).length; return `${n} trades · ${(100*wins/n).toFixed(0)}% win · ${money(a.reduce((p,x)=>p+(x.pnl||0),0))}`; };
  return html`<div className="kv"><b>Jev agrees (≥ 0.65)</b><span className="num">${s(w)}</span><b>Jev neutral, against, or no news</b><span className="num">${s(o)}</span></div>`;
}
function Signals({k, L, signals}){
  const t=E.ct(Date.now()); const rows=Object.entries(L.sigs[k]||{}).filter(([s])=>L.inPlay.includes(s)).sort((a,b)=>(!!b[1].sig-!!a[1].sig));
  const skipped=signals.filter(s=>s.date===t.date && !s.taken).sort((a,b)=>b.at-a.at).slice(0,8);
  return html`<div style=${{display:'grid',gap:'8px'}}>
    ${!rows.length? html`<div className="empty">Signals show here for in-play tickers once 1-minute bars load during market hours.</div>` :
    html`<div className="tbl"><table><thead><tr><th className="l">Ticker</th><th className="l">State</th><th>Levels</th></tr></thead><tbody>
    ${rows.slice(0,30).map(([s,r])=>{ const lv=r.levels||{}; const lvTxt = k==='m1'? (lv.trigUp? `↑${f2(lv.trigUp)} ↓${f2(lv.trigDn)} · flow ${pct((lv.flow||0)*100,0)}`:'') : (lv.vwap? `VWAP ${f2(lv.vwap)}`+(lv.ema20?` · 20e ${f2(lv.ema20)}`:'')+(lv.sma20?` · 20d ${f2(lv.sma20)}`:''):'');
      return html`<tr key=${s} className=${r.sig?'go':''}><td className="sym l">${s}</td><td className="txt">${r.sig? html`<b className="up">GO ${r.sig.side>0?'CALLS':'PUTS'}</b> · ${r.sig.setup}` : r.note}</td><td>${lvTxt}</td></tr>`; })}</tbody></table></div>`}
    ${skipped.length? html`<details><summary>Signals skipped today · ${skipped.length}</summary><div className="tbl"><table><tbody>${skipped.map(s=>html`<tr key=${s.id}><td className="sym l">${s.sym}</td><td>${E.hm(s.min)}</td><td className="txt">${s.reason}</td></tr>`)}</tbody></table></div></details>` : null}
  </div>`;
}
function BacktestPanel({k, bt, runBt, swing}){

  const running = btState.running===k || (btState.running==='intra' && !swing);
  const s=bt && bt.summary;
  return html`<div className="panel">
    <div className="row between"><h2>Backtest</h2>${bt? html`<span className="note">Last run ${new Date(bt.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} · ${bt.period}</span>`:null}</div>
    <p className="note">${k==='td'? 'Daily bars from Massive with weekly and monthly built from them, same rules as the live tab: $50,000 account, $500 risk per trade, $10,000 max per position, 5 positions max. The backtest enters at the next open; live trading waits for the hourly and 15-minute confirmation instead, so live entries will differ somewhat.' : swing? 'Daily bars from Massive, same rules as the live tab: $50,000 account, 1% risk ($500) per trade, $10,000 max per position, 6 positions max, breakouts ranked first. Shares, filled at the next open.' :
      'Same detector and exit code as the live tab, run on Massive 1-minute bars. Results are on the underlying in R (multiples of the stop distance) and in dollars at $500 risk per trade. Option fills are not simulated here; the live paper account uses real option quotes. Running one intraday tab runs all three on the same data.'}</p>
    <div className="form">
      <label for=${'bt-m-'+k}>Period<select id=${'bt-m-'+k} value=${months} onChange=${e=>setMonths(+e.target.value)}>${(swing?[[12,'1 year'],[24,'2 years'],[36,'3 years']]:[[1,'1 month'],[2,'2 months'],[3,'3 months'],[6,'6 months']]).map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select></label>
      <label for=${'bt-s-'+k}>Tickers${swing?' (ALL = full scanner list)':''}<input id=${'bt-s-'+k} type="text" value=${syms} onInput=${e=>setSyms(e.target.value)}/></label>
      <button className="primary" disabled=${!!btState.running} onClick=${()=>runBt({months, syms})}>${running?'Running…':'Run backtest'}</button>
      <span className="note">Takes a few minutes: it runs behind the live board so it never uses up the request limit trading needs. Best run after the close.</span>
    </div>
    ${running? html`<div className="prog"><div style=${{width:Math.round(btState.pct*100)+'%'}}></div></div><div className="note">${btState.msg}</div>` : (btState.err && btState.errTab===k ? html`<div className="err">${btState.err}</div>` : null)}
    ${s? html`<div className="stats">
      <${Stat} k="Trades" v=${s.n}/><${Stat} k="Win rate" v=${s.win!=null?s.win.toFixed(1)+'%':'–'}/><${Stat} k="Avg R" v=${s.avgR!=null?s.avgR.toFixed(2):'–'} c=${cls(s.avgR)}/>
      <${Stat} k="Profit factor" v=${s.pf!=null?s.pf.toFixed(2):'–'} c=${s.pf>=1.3?'up':(s.pf!=null&&s.pf<1?'dn':'')}/><${Stat} k="Net P&L" v=${money(s.pnl)} c=${cls(s.pnl)}/><${Stat} k="Max drawdown" v=${money(-s.maxDD,false)} c="dn"/></div>
      ${bt.curve? html`<${Curve} pts=${bt.curve}/>`:null}
      ${bt.rows? html`<details open><summary>${swing?'By setup and year':'By ticker'}</summary><div className="tbl"><table><thead><tr><th className="l">${swing?'Group':'Ticker'}</th><th>Trades</th><th>Win</th><th>Avg R</th><th>PF</th><th>P&L</th></tr></thead><tbody>
        ${bt.rows.map(r=>html`<tr key=${r.k}><td className="l">${r.k}</td><td>${r.n}</td><td>${r.win!=null?r.win.toFixed(0)+'%':'–'}</td><td className=${cls(r.avgR)}>${r.avgR!=null?r.avgR.toFixed(2):'–'}</td><td>${r.pf!=null?r.pf.toFixed(2):'–'}</td><td className=${cls(r.pnl)}>${money(r.pnl)}</td></tr>`)}</tbody></table></div></details>`:null}` :
      html`<div className="empty">No backtest saved for this tab yet. Run one before trusting the live paper results.</div>`}
    ${k==='sw'? html`<details><summary>Reference: SQL check run Oct 27 (40 tickers, 3 years, no position cap)</summary><p className="note" style=${{marginTop:'6px'}}>Pullbacks 428 trades · 35.7% win · avg +0.25R · PF 1.75. Breakouts 105 trades · 48.6% win · avg +0.52R · PF 2.43. Profit factor stayed above 1 every year 2023–2026, but 2026 was the weakest year (pullbacks PF 1.36, breakouts 1.45). Up to 27 signals overlapped at once, so the live tab's 6-position cap and ranking matter.</p></details>`:null}
  </div>`;
}

function EarnNote(){ const t=E.ct(Date.now()).date;
  return html`<p className=${'note'+(earnStale(t)?' err':'')} style=${{marginTop:'6px'}}>${EARN.asOf? `Earnings dates: ${EARN.source||'TradingView'}, updated ${dshort(EARN.asOf)} for ${Object.keys(EARN.map).length} stocks (ETFs have none).${earnStale(t)?' Over a week old: ask Claude to refresh them.':''}` : 'Earnings dates not loaded yet: ask Claude to load them from TradingView. Until then the earnings rules cannot run.'}${CROWD.asOf? ` Crowd lean (the "% L" badge): share of Liquid traders long, updated ${dshort(CROWD.asOf)}. Green = crowd mostly short, red = crowd mostly long. For information only: it does not change entries or exits.` : ''}</p>`; }
const TBADGE = t => html`<span className=${'pill '+(t==='up'?'win':(t==='down'?'loss':''))}>${t==='up'?'UP':(t==='down'?'DOWN':'RANGE')}</span>`;
function TDTab({a, L, scans, runScan, bt, runBt, openChart}){

    <${BacktestPanel} k="td" bt=${bt} runBt=${runBt} swing=${true}/>
    <div className="panel"><h2>How it reads the charts</h2><ol className="rules">
      <li><b>Monthly and weekly set the direction.</b> Up means higher highs and higher lows (or price above a rising 10-month / 20-week average). Longs need the weekly up and the monthly not down; shorts are the mirror image.</li>
      <li><b>Daily finds the trade.</b> The Action Line is the trendline drawn through the daily swing lows (uptrend) or highs (downtrend). Bounce: the 3rd+ touch of a line that is at least a week old, holding with the close in the top half of the bar. Pullback break: price pulls back into the Action Line or a support level, then closes back through the short pullback line.</li>
      <li><b>Room to run.</b> Support and resistance come from swing highs and lows on the monthly, weekly and daily charts, grouped where they cluster. The next level must be at least 2× the stop distance away, or the setup is skipped.</li>
      <li><b>Hourly and 15-minute time the entry.</b> Hourly above its 20 EMA with a higher low, then a 15-minute close above the last two 15-minute highs on normal volume, within 1 ATR of the setup price.</li>
      <li><b>Risk and exits.</b> Stop just beyond the Action Line (0.3 ATR buffer, 0.5–2.5 ATR from entry) or under the pullback low. Half off at 2R with the stop moved to breakeven, the rest at the next level (or 4R). A daily close back through the Action Line, the 20-day for breaks, or 30 trading days ends the trade. Shares, $500 risk, $10,000 max, 5 positions.</li><li><b>Earnings.</b> No new setup within 14 days of a report, and an open position is sold at 2:55 PM CT on the last session before the report.</li></ol>${EarnNote()}</div>
  </div>`;
}

const TFS = [['M','Monthly'],['W','Weekly'],['D','Daily'],['H','1 hour'],['15','15 min']];
function tfPath(sym, tf){ const t=E.ct(Date.now()).date;
  return {M:[`/v2/aggs/ticker/${sym}/range/1/month/${E.shiftDays(t,-3650)}/${t}`], W:[`/v2/aggs/ticker/${sym}/range/1/week/${E.shiftDays(t,-1460)}/${t}`], D:[`/v2/aggs/ticker/${sym}/range/1/day/${E.shiftDays(t,-420)}/${t}`],
    H:[`/v2/aggs/ticker/${sym}/range/1/hour/${E.shiftDays(t,-30)}/${t}`], '15':[`/v2/aggs/ticker/${sym}/range/15/minute/${E.shiftDays(t,-7)}/${t}`]}[tf][0]; }
function ChartsTab({sym, setSym, mcp, L, scans, trades}){
  const [tf,setTf]=useState(()=>lsGet('v3-tf','D')); const [data,setData]=useState({}); const [err,setErr]=useState(''); const [input,setInput]=useState(sym); const [busy,setBusy]=useState(false);
  const box=useRef(null), chartRef=useRef(null);
  useEffect(()=>lsSet('v3-tf',tf),[tf]); useEffect(()=>setInput(sym),[sym]);
  const load = useCallback(async ()=>{
    if(!mcp){ setErr('Charts need the Massive connection in the Claude desktop app on your Mac.'); return; } setBusy(true); setErr('');
    const out={};
    for(const [k] of TFS){ try{ const txt=await massive(mcp, tfPath(sym,k), {adjusted:'true',sort:'asc',limit:5000}, 'live');
      let bars=E.toBars(E.parseCSV(txt)); if(k==='H') bars=bars.filter(b=>{ const m=E.ct(b.t).min; return m>=480 && m<E.CLOSE; }); if(k==='15') bars=E.rth(bars); out[k]=bars; }catch(e){ out[k]=[]; } }
    setData(out); setBusy(false); if(!Object.values(out).some(x=>x.length)) setErr('No bars came back from Massive for '+sym+'.');
  },[sym, mcp]);
  useEffect(()=>{ load(); },[load]);
  useEffect(()=>{ if(tf!=='H' && tf!=='15') return; const id=setInterval(()=>{ if(document.visibilityState==='visible') load(); }, 60000); return ()=>clearInterval(id); },[tf, load]);
  const keys=Object.keys(scans).sort(); const latest=keys.length? scans[keys[keys.length-1]] : null; const cand=latest && (latest.td||[]).find(x=>x.sym===sym);
  const pos=trades.find(x=>x.sym===sym && x.status==='open' && (x.tab==='td'||x.tab==='sw'));
  const reads = useMemo(()=>{ const o={}; for(const [k] of TFS){ const b=data[k]; o[k]= b && b.length>=20 ? TD.chartRead(b) : null; } return o; },[data]);
  // draw
  useEffect(()=>{
    const LW=window.LightweightCharts; const bars=data[tf]; if(!box.current) return;
    if(!LW){ setErr('The chart library did not load. Check the connection and reopen the board.'); return; }
    if(chartRef.current){ chartRef.current.remove(); chartRef.current=null; }
    if(!bars || !bars.length) return;
    const css=getComputedStyle(document.documentElement); const tok=n=>css.getPropertyValue(n).trim();
    const intra = tf==='H'||tf==='15';
    const T = b => { if(!intra) return E.ct(b.t+12*3600e3).date; const p=E.ct(b.t); const [y,m,d]=p.date.split('-').map(Number); return Date.UTC(y,m-1,d,Math.floor(p.min/60),p.min%60)/1000; };
    const ch=LW.createChart(box.current,{height:480, width:box.current.clientWidth, layout:{background:{type:'solid',color:tok('--panel')}, textColor:tok('--muted'), fontFamily:'IBM Plex Mono, ui-monospace, monospace'},
      grid:{vertLines:{color:tok('--line')}, horzLines:{color:tok('--line')}}, rightPriceScale:{borderColor:tok('--line-2')}, timeScale:{borderColor:tok('--line-2'), timeVisible:intra, secondsVisible:false}, crosshair:{mode:0}});
    chartRef.current=ch;
    const cs=ch.addCandlestickSeries({upColor:tok('--go'), downColor:tok('--warn'), borderVisible:false, wickUpColor:tok('--go'), wickDownColor:tok('--warn')});
    const seen=new Set(); const rows=[]; for(const b of bars){ const tt=T(b); const key=String(tt); if(seen.has(key)) continue; seen.add(key); rows.push({time:tt, open:b.o, high:b.h, low:b.l, close:b.c, value:b.v}); }
    cs.setData(rows.map(r=>({time:r.time, open:r.open, high:r.high, low:r.low, close:r.close})));
    const vs=ch.addHistogramSeries({priceFormat:{type:'volume'}, priceScaleId:'vol', color:tok('--line-2'), lastValueVisible:false, priceLineVisible:false}); vs.priceScale().applyOptions({scaleMargins:{top:0.82,bottom:0}}); vs.setData(rows.map(r=>({time:r.time, value:r.value})));
    const rd=reads[tf]; const n=bars.length;
    const seg=(ln, color, w)=>{ if(!ln) return; const s2=ch.addLineSeries({color, lineWidth:w||2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false});
      const a=Math.max(0,ln.ia); const pts=[{time:rows[Math.min(a,rows.length-1)].time, value:ln.pa},{time:rows[rows.length-1].time, value:ln.at(n-1)}]; if(pts[0].time!==pts[1].time) s2.setData(pts); };
    if(rd){ seg(rd.sup, tok('--go')); seg(rd.res, tok('--warn'));
      const px=bars[n-1].c; const near=rd.levels.slice().sort((x,y)=>Math.abs(x.price-px)-Math.abs(y.price-px)).slice(0,6);
      for(const lv of near) cs.createPriceLine({price:lv.price, color: lv.price>px? tok('--warn') : tok('--go'), lineWidth:1, lineStyle:2, axisLabelVisible:true, title:(lv.price>px?'R':'S')+' · '+lv.touches+' swings'}); }
    // the board's own Action Line from the daily scan, on the daily chart
    const act = (pos && pos.action) || (cand && cand.action);
    if(act && tf==='D'){ const i1=bars.findIndex(b=>b.t>=act.t1); if(i1>=0){ const s3=ch.addLineSeries({color:tok('--accent'), lineWidth:3, priceLineVisible:false, lastValueVisible:true, title:'Action Line'});
      const off=n-1-i1; s3.setData([{time:rows[Math.min(i1,rows.length-1)].time, value:act.p1},{time:rows[rows.length-1].time, value:act.p1+act.slope*off}]); } }
    const plan = pos ? {entry:pos.entryUnder, stop:pos.stop, t1:pos.t1, t2:pos.t2} : cand ? {entry:cand.entry, stop:cand.stop, t1:cand.t1, t2:cand.t2} : null;
    if(plan){ cs.createPriceLine({price:plan.entry, color:tok('--fg'), lineWidth:1, lineStyle:0, axisLabelVisible:true, title:pos?'Entry':'Setup'});
      cs.createPriceLine({price:plan.stop, color:tok('--warn'), lineWidth:2, lineStyle:0, axisLabelVisible:true, title:'Stop'});
      cs.createPriceLine({price:plan.t1, color:tok('--go'), lineWidth:1, lineStyle:0, axisLabelVisible:true, title:'T1'});
      cs.createPriceLine({price:plan.t2, color:tok('--go'), lineWidth:2, lineStyle:0, axisLabelVisible:true, title:'T2'}); }
    const vis = {M:60, W:104, D:160, H:140, '15':160}[tf]; if(rows.length>vis) ch.timeScale().setVisibleLogicalRange({from:rows.length-vis, to:rows.length+3}); else ch.timeScale().fitContent();
    const ro=new ResizeObserver(()=>{ if(box.current && chartRef.current) chartRef.current.applyOptions({width:box.current.clientWidth}); }); ro.observe(box.current);
    return ()=>{ ro.disconnect(); };
  },[data, tf, reads, cand, pos]);
  useEffect(()=>()=>{ if(chartRef.current){ chartRef.current.remove(); chartRef.current=null; } },[]);
  const quick=[...new Set([...(latest&&latest.td||[]).map(x=>x.sym), ...trades.filter(x=>x.status==='open').map(x=>x.sym), ...PIN_DEFAULT])].slice(0,14);
  const px = data.D && data.D.length ? data.D[data.D.length-1].c : null;
  return html`<div style=${{display:'grid',gap:'14px'}}>
    <div className="panel">
      <div className="row between"><div className="row"><h2>${sym}</h2>${px?html`<span className="num">${f2(px)}</span>`:null}${cand? html`<span className=${'pill '+(cand.side>0?'call':'put')}>TOP-DOWN ${cand.side>0?'LONG':'SHORT'} SETUP</span>`:null}${pos?html`<span className="pill open">OPEN IN ${TABNAME[pos.tab].toUpperCase()}</span>`:null}</div>
        <form className="row" onSubmit=${e=>{ e.preventDefault(); const v=input.trim().toUpperCase(); if(v) setSym(v); }}><input id="chart-sym" type="text" value=${input} onInput=${e=>setInput(e.target.value.toUpperCase())} style=${{width:'110px'}} aria-label="Ticker"/><button className="sm primary" type="submit">Load</button><button className="sm" type="button" onClick=${load} disabled=${busy}>${busy?'Loading…':'Refresh'}</button></form></div>
      <div className="row">${quick.map(q=>html`<button key=${q} className=${'sm '+(q===sym?'primary':'ghost')} onClick=${()=>setSym(q)}>${q}</button>`)}</div>
      <div className="row" role="tablist" aria-label="Timeframe">${TFS.map(([k,l])=>html`<button key=${k} role="tab" aria-selected=${tf===k} className=${'sm '+(tf===k?'primary':'')} onClick=${()=>setTf(k)}>${l}</button>`)}</div>
      ${err? html`<div className="err">${err}</div>`:null}
      <div ref=${box} style=${{width:'100%', minHeight:'480px'}} aria-label=${sym+' '+tf+' candlestick chart with trendlines and levels'}></div>
      <div className="note">Green line: support trendline through the swing lows. Red line: resistance trendline through the swing highs. Dashed lines: the nearest support (S) and resistance (R) levels, with how many swing highs and lows formed there. Blue line: the board's Action Line from the daily scan. Lines redraw from each timeframe's own swings, so switching timeframes adjusts them automatically. 1-hour and 15-minute refresh every minute.</div>
    </div>
    <div className="panel"><h2>Top-down read</h2><div className="tbl"><table><thead><tr><th className="l">Timeframe</th><th className="l">Trend</th><th>Support line</th><th>Resistance line</th><th>Nearest support</th><th>Nearest resistance</th></tr></thead><tbody>
      ${TFS.map(([k,l])=>{ const r=reads[k], b=data[k]; if(!r||!b) return html`<tr key=${k}><td className="l">${l}</td><td className="l" colSpan="5"><span className="tag">${busy?'loading':'not enough bars'}</span></td></tr>`;
        const p=b[b.length-1].c, n=b.length; const sup=r.levels.filter(x=>x.price<p).sort((x,y)=>y.price-x.price)[0], res=r.levels.filter(x=>x.price>p).sort((x,y)=>x.price-y.price)[0];
        return html`<tr key=${k}><td className="l"><button className="sm ghost" onClick=${()=>setTf(k)}>${l}</button></td><td className="l">${TBADGE(r.trend)}</td>
          <td>${r.sup? f2(r.sup.at(n-1))+' · '+r.sup.touches+' touches' : '–'}</td><td>${r.res? f2(r.res.at(n-1))+' · '+r.res.touches+' touches' : '–'}</td>
          <td className="up">${sup? f2(sup.price) : '–'}</td><td className="dn">${res? f2(res.price) : '–'}</td></tr>`; })}</tbody></table></div>
      <p className="note">Read it top to bottom: the monthly and weekly rows should agree before the daily setup matters, and the hourly and 15-minute rows tell you whether the entry is ready. Charts by TradingView Lightweight Charts, data from Massive.</p></div>
  </div>`;
}

function DataLog(){ const [,f]=useState(0); useEffect(()=>{ const id=setInterval(()=>f(x=>x+1),2000); return ()=>clearInterval(id); },[]);
  return html`<div className="panel"><h2>Data log</h2><p className="note">Massive requests this session: ${STATS.ok} ok · ${STATS.retried} retried · ${STATS.fail} failed after retries. Current pace ${GOV.rate} requests a minute · slowed down ${GOV.limited} times by the Claude app's limit${Date.now()<GOV.pausedUntil?' · paused '+Math.ceil((GOV.pausedUntil-Date.now())/1000)+'s':''}. The limit is shared by every board open on this Mac, so a second board slows this one. Trade management goes first, then live data, then scans, then backtests.</p>
    ${!ERRLOG.length? html`<div className="empty">No data errors so far.</div>` : html`<div className="tbl"><table><thead><tr><th className="l">Time</th><th className="l">Error</th><th className="l">Request</th><th>Try</th><th className="l">Message</th></tr></thead><tbody>
      ${ERRLOG.slice(0,15).map((x,i)=>html`<tr key=${i}><td className="l">${tms(x.at)}</td><td className="l">${x.code}</td><td className="l">${x.path}</td><td>${x.attempt}</td><td className="txt">${x.msg}</td></tr>`)}</tbody></table></div>`}</div>`; }

      <label className="row" for="sl-go"><input id="sl-go" type="checkbox" checked=${cfg.slackGo} onChange=${e=>setCfg(c=>({...c, slackGo:e.target.checked}))}/> Slack DM me on every paper GO IN</label>
      <div className="form"><label for="sl-to">Slack channel or user ID<input id="sl-to" type="text" value=${cfg.slackTo} onInput=${e=>setCfg(c=>({...c, slackTo:e.target.value.trim()}))}/></label><button className="sm" disabled=${!mcp} onClick=${async()=>{ await slack('Conviction Board v3 test alert: alerts are working.'); setMsg('Test alert sent to Slack.'); }}>Send test</button></div>
      <p className="note">Data health: ${health.calls} calls this session · last error ${health.lastErr||'none'}. The light at the top turns yellow after 25 seconds without fresh data and red after 60. The page asks the Mac to keep the screen awake while it is open.</p></div>
    <${DataLog}/>

      <div className="form"><label for="reset">Type RESET to confirm<input id="reset" type="text" value=${confirm} onInput=${e=>setConfirm(e.target.value)}/></label><button disabled=${confirm!=='RESET'} onClick=${reset}>Reset accounts</button></div></div>
    ${msg? html`<div className="banner info">${msg}</div>`:null}
  </div>`;
}

/* ---------- mount + backtest runner wiring ---------- */
function Root(){
  const [mcp,setMcp]=useState(null), [db,setDb]=useState(null);
  useEffect(()=>{ const c=window.claude; if(!c||!c.use) return; c.use('mcp').then(setMcp).catch(()=>{}); c.use('db').then(setDb).catch(()=>{}); },[]);
  useEffect(()=>{
    const api=(path,params)=>massive(mcp, path, params, 'bt');
    const all=async(path,params)=>{ let rows=[], p={path,params}, g=0; while(p && g++<80){ const txt=await api(p.path,p.params); rows=rows.concat(E.parseCSV(txt)); p=E.nextPage(txt); } return rows; };
    const cache={};
    runBt = async (k, o)=>{
      if(!mcp){ btState={running:null, err:'Backtests need the Massive connection in the Claude desktop app on your Mac.', errTab:k}; return; }
      const t=E.ct(Date.now()); const swing=k==='sw';
      let syms = (o.syms||'').toUpperCase().split(/[\s,]+/).filter(Boolean); if((swing||k==='td') && (syms.length===0 || syms[0]==='ALL')) syms=[...E.UNIVERSE];
      btState={running: swing?'sw':(k==='td'?'td':'intra'), msg:'Loading data…', pct:0}; const failed={}; const noteFail=(s,e)=>{ failed[s]=(e&&e.code)||'error'; };
      try{
        if(k==='td'){
          const startD=E.shiftDays(t.date,-Math.round(o.months*30.5)); const from=E.shiftDays(startD,-800); const series={}; let done=0; const q=[...syms];
          await Promise.all([0,1].map(async()=>{ while(q.length){ const s=q.shift(); try{ series[s]=E.toBars(E.parseCSV(await api(`/v2/aggs/ticker/${s}/range/1/day/${from}/${t.date}`,{adjusted:'true',sort:'asc',limit:5000}))); }catch(e){ noteFail(s,e); } done++; btState.pct=done/syms.length*0.85; btState.msg=`Daily bars ${done}/${syms.length}`+(Object.keys(failed).length?` · ${Object.keys(failed).length} failed`:''); } }));
          if(Object.keys(series).length<Math.max(1,syms.length*0.5)) throw {code:'too_few', message:`Only ${Object.keys(series).length} of ${syms.length} tickers loaded`};
          btState.msg='Running the top-down rules…'; await new Promise(r=>setTimeout(r,30));
          const res=TD.backtest(series, {...E.DEFAULTS, maxOpenTD:5}, startD); const trs=res.closed; const sum=E.summarize(trs);
          const rows=[]; const grp=(fn)=>{ const g={}; trs.forEach(x=>{ const kk=fn(x); (g[kk]=g[kk]||[]).push(x); }); Object.keys(g).sort().forEach(kk=>{ const s2=E.summarize(g[kk]); rows.push({k:kk, n:s2.n, win:s2.win, avgR:s2.avgR, pf:s2.pf, pnl:s2.pnl}); }); };
          grp(x=>x.setup+(x.side>0?' · long':' · short')); grp(x=>x.date.slice(0,4));
          let eq=E.ACCOUNT; const curve=[{eq}]; trs.slice().sort((a,b)=>a.xdate<b.xdate?-1:1).forEach(x=>{ eq+=x.pnl; curve.push({eq}); });
          await db.collection('v3bt').doc('td').set({at:Date.now(), period:`${dyear(startD)} – ${dyear(t.date)} · ${Object.keys(series).length} tickers`, summary:sum, rows, avgDays: trs.length? trs.reduce((a,x)=>a+x.days,0)/trs.length : null, curve:curve.filter((_,i)=>i%Math.max(1,Math.ceil(curve.length/300))===0||i===curve.length-1)});
        } else if(swing){
          const from=E.shiftDays(t.date, -Math.round(o.months*30.5)-260); const series={}; let done=0; const q=[...new Set([...syms,'SPY'])];
          await Promise.all([0,1].map(async()=>{ while(q.length){ const s=q.shift(); try{ series[s]=E.toBars(E.parseCSV(await api(`/v2/aggs/ticker/${s}/range/1/day/${from}/${t.date}`,{adjusted:'true',sort:'asc',limit:5000}))); }catch(e){ noteFail(s,e); } done++; btState.pct=done/(syms.length+1)*0.9; btState.msg=`Daily bars ${done}/${syms.length+1}`+(Object.keys(failed).length?` · ${Object.keys(failed).length} failed`:''); } }));
          if(!series.SPY || Object.keys(series).length<Math.max(2,syms.length*0.5)) throw {code:'too_few', message:`Only ${Object.keys(series).length} of ${syms.length+1} tickers loaded${series.SPY?'':' (SPY missing)'}`};
          const spy=series.SPY; if(!syms.includes('SPY')) delete series.SPY;
          const res=E.backtestSwing(series, spy, E.DEFAULTS); const startD=E.shiftDays(t.date,-Math.round(o.months*30.5));
          const trs=res.closed.filter(x=>x.date>=startD); const sum=E.summarize(trs);
          const rows=[]; const grp=(key,fn)=>{ const g={}; trs.forEach(x=>{ const kk=fn(x); (g[kk]=g[kk]||[]).push(x); }); Object.keys(g).sort().forEach(kk=>{ const s=E.summarize(g[kk]); rows.push({k:kk, n:s.n, win:s.win, avgR:s.avgR, pf:s.pf, pnl:s.pnl}); }); };
          grp('setup', x=>x.setup); grp('year', x=>x.date.slice(0,4)+' '+x.setup);
          let eq=E.ACCOUNT; const curve=[{eq}]; trs.slice().sort((a,b)=>a.xdate<b.xdate?-1:1).forEach(x=>{ eq+=x.pnl; curve.push({eq}); });
          await db.collection('v3bt').doc('sw').set({at:Date.now(), period:`${dyear(startD)} – ${dyear(t.date)} · ${Object.keys(series).length} tickers`, summary:sum, rows, curve:curve.filter((_,i)=>i%Math.max(1,Math.ceil(curve.length/300))===0||i===curve.length-1)});
        } else {
          const start=E.shiftDays(t.date, -Math.round(o.months*30.5)); const per={m1:[],m5:[],m15:[]}; let done=0;
          for(const s of syms){
            btState.msg=`${s}: loading 1-minute bars (${done+1}/${syms.length})`;
            const key=s+'|'+start; let rec=cache[key];
            try{
            if(!rec){ const daily=E.toBars(E.parseCSV(await api(`/v2/aggs/ticker/${s}/range/1/day/${E.shiftDays(start,-60)}/${t.date}`,{adjusted:'true',sort:'asc',limit:5000})));
              const mins=E.toBars(await all(`/v2/aggs/ticker/${s}/range/1/minute/${start}/${t.date}`,{adjusted:'true',sort:'asc',limit:50000})); rec={daily, days:E.byDay(mins)}; cache[key]=rec; }
            const dctx=(date)=>{ const d=rec.daily.filter(b=>E.ct(b.t+12*3600e3).date<date); return d.length>=20? E.dailyCtx(d) : null; };
            for(const k2 of ['m1','m5','m15']) per[k2].push(...E.backtestIntraday(k2, s, rec.days, dctx, E.DEFAULTS));
            }catch(e){ noteFail(s,e); }
            done++; btState.pct=done/syms.length; await new Promise(r=>setTimeout(r,0));
          }
          if(Object.keys(failed).length>=syms.length) throw {code:'all_failed', message:'No ticker loaded'};
          for(const k2 of ['m1','m5','m15']){ const trs=per[k2]; const sum=E.summarize(trs); const rows=[]; const g={}; trs.forEach(x=>(g[x.sym]=g[x.sym]||[]).push(x));
            Object.keys(g).forEach(s=>{ const q=E.summarize(g[s]); rows.push({k:s, n:q.n, win:q.win, avgR:q.avgR, pf:q.pf, pnl:q.pnl}); }); rows.sort((a,b)=>b.pnl-a.pnl);
            let eq=E.ACCOUNT; const curve=[{eq}]; trs.slice().sort((a,b)=>a.date===b.date? a.entryMin-b.entryMin : (a.date<b.date?-1:1)).forEach(x=>{ eq+=x.pnl; curve.push({eq}); });
            await db.collection('v3bt').doc(k2).set({at:Date.now(), period:`${dyear(start)} – ${dyear(t.date)} · ${syms.length-Object.keys(failed).length} of ${syms.length} tickers`, summary:sum, rows, curve:curve.filter((_,i)=>i%Math.max(1,Math.ceil(curve.length/300))===0||i===curve.length-1)}); }
        }
        btState={running:null, msg:'', pct:1};
      }catch(e){ const last=ERRLOG[0]; btState={running:null, err:'Backtest stopped: '+((e&&e.message)||(e&&e.code)||'error')+(last?` · last data error: ${last.code}${last.msg?' – '+last.msg:''}`:'')+'. Settings → Data log shows the details.', errTab:k}; }
    };
  },[mcp, db]);
  return html`<${App}/>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Root}/>`);
})();

</script>
